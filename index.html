<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Melon Project</title>
  <style>
    :root {
      --bg: #29484d;
      --surface: rgba(54, 88, 93, .9);
      --surface-strong: #3d696e;
      --text: #fff8ef;
      --muted: #d3e1df;
      --line: rgba(255, 248, 239, .2);
      --accent: #ff974b;
      --shadow: 0 24px 80px rgba(7, 22, 25, .42);
      --radius: 24px;
    }

    html { font-size: 110%; }

    [data-theme="light"] {
      --bg: #e9eee7;
      --surface: rgba(255, 255, 255, .9);
      --surface-strong: #fff;
      --text: #17231b;
      --muted: #607064;
      --line: rgba(23, 35, 27, .15);
      --accent: #63bd46;
      --shadow: 0 24px 80px rgba(40, 88, 42, .15);
    }

    [data-theme="dark"] {
      --bg: #111318;
      --surface: rgba(28, 31, 40, .88);
      --surface-strong: #202430;
      --text: #f4f5f7;
      --muted: #a5aab7;
      --line: rgba(255, 255, 255, .13);
      --accent: #62c7b2;
    }

    [data-theme="melon-light"] {
      --bg: #cfe9e5;
      --surface: rgba(255, 251, 245, .92);
      --surface-strong: #fff;
      --text: #3d2920;
      --muted: #866b5d;
      --line: rgba(61, 41, 32, .15);
      --accent: #f28a3d;
      --shadow: 0 24px 80px rgba(151, 79, 32, .16);
    }

    [data-theme="melon-dark"] {
      --bg: #203b40;
      --surface: rgba(47, 79, 84, .94);
      --surface-strong: #37636a;
      --text: #fff8ef;
      --muted: #d3e1df;
      --line: rgba(255, 248, 239, .2);
      --accent: #ff974b;
    }

    [data-theme="crimson"] {
      --bg: #17090f;
      --surface: rgba(52, 13, 29, .84);
      --surface-strong: #671b37;
      --text: #fff3f6;
      --muted: #d8a8b8;
      --line: rgba(255, 105, 145, .32);
      --accent: #ff4f7b;
      --shadow: 0 0 55px rgba(255, 23, 79, .22);
    }

    [data-theme="nebula"] {
      --bg: #110d1f;
      --surface: rgba(38, 22, 65, .84);
      --surface-strong: #51318a;
      --text: #f8f2ff;
      --muted: #c4aedc;
      --line: rgba(194, 131, 255, .3);
      --accent: #c783ff;
      --shadow: 0 0 55px rgba(169, 77, 255, .22);
    }

    [data-theme="eyeburn"] {
      --bg: #000;
      --surface: #080808;
      --surface-strong: #111;
      --text: #fff;
      --muted: #bcbcbc;
      --line: #555;
      --accent: #fff;
      --shadow: 0 0 30px rgba(255, 255, 255, .1);
    }

    [data-theme="plum"] {
      --bg: #17121d;
      --surface: rgba(39, 27, 49, .88);
      --surface-strong: #342443;
      --accent: #7affc6;
    }

    [data-theme="sand"] {
      --bg: #171614;
      --surface: rgba(45, 39, 31, .9);
      --surface-strong: #514332;
      --accent: #ffd166;
    }

    [data-theme="aura"] {
      --bg: #fff;
      --surface: rgba(255, 255, 255, .94);
      --surface-strong: #fff;
      --text: #000;
      --muted: #888;
      --line: #000;
      --accent: #000;
      --shadow: 0 0 26px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 42rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .4s ease, color .4s ease;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .23;
      background-image: linear-gradient(color-mix(in srgb, var(--text) 7%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--text) 7%, transparent) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }

    button, a { font: inherit; }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(4rem, 10vw, 8rem) 0 7rem;
    }

    .hero {
      position: relative;
      padding: clamp(2rem, 6vw, 4.5rem);
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .hero::after {
      position: absolute;
      width: 16rem;
      height: 16rem;
      top: -10rem;
      right: -5rem;
      content: "";
      border-radius: 50%;
      background: var(--accent);
      opacity: .12;
      filter: blur(8px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      letter-spacing: -.02em;
      line-height: 1;
    }

    .melon {
      display: grid;
      width: 1.1em;
      height: 1.1em;
      place-items: center;
      font-size: .82em;
      border-radius: 30% 55% 34% 58%;
      background: var(--accent);
      box-shadow: 0 0 0 .12em color-mix(in srgb, var(--accent) 20%, transparent);
      transform: rotate(-10deg);
      animation: bob 4s ease-in-out infinite;
    }

    .intro {
      max-width: 650px;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.14rem);
      line-height: 1.7;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 3.5rem .25rem 1rem;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -.02em;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .app-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: 150px;
      padding: 1.35rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .app-card:nth-child(2) { animation-delay: .08s; }
    .app-card:nth-child(3) { animation-delay: .16s; }
    .app-card:nth-child(4) { animation-delay: .24s; }

    .app-card:hover, .app-card:focus-within {
      border-color: var(--accent);
      background: var(--surface-strong);
      transform: translateY(-5px);
    }

    .app-icon {
      display: grid;
      width: 3.1rem;
      height: 3.1rem;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      font-size: 1.45rem;
    }

    .app-card h3 { margin: 0 0 .4rem; font-size: 1.08rem; }
    .app-card p { max-width: 28ch; margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; }

    .arrow {
      color: var(--accent);
      font-size: 1.3rem;
      transition: transform .25s ease;
    }

    .app-card:hover .arrow { transform: translateX(4px); }

    .corner-tools {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      left: 1.25rem;
      z-index: 5;
      display: flex;
      align-items: end;
      justify-content: space-between;
      pointer-events: none;
    }

    .socials { display: flex; flex-direction: column; gap: .55rem; }

    .socials, .settings-wrap { pointer-events: auto; }

    .icon-button, .social {
      display: grid;
      width: 3.18rem;
      height: 3.18rem;
      place-items: center;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
      cursor: pointer;
      transition: transform .2s ease, color .2s ease, border-color .2s ease;
      backdrop-filter: blur(12px);
    }

    .icon-button:hover, .social:hover, .icon-button:focus-visible, .social:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      outline: none;
      transform: translateY(-3px);
    }

    .icon-button { font-size: 1.18rem; }
    .social svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }

    .settings-panel {
      position: absolute;
      right: 0;
      bottom: 3.5rem;
      width: min(330px, calc(100vw - 2.5rem));
      padding: 1.2rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(.97);
      transform-origin: bottom right;
      transition: opacity .2s ease, transform .2s ease;
    }

    .settings-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .settings-panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--line); }
    .setting label, .setting span { font-size: .88rem; }

    select {
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: .45rem .55rem;
      background: var(--surface);
    }

    .switch { position: relative; width: 2.8rem; height: 1.55rem; }
    .switch input { width: 0; height: 0; opacity: 0; }
    .slider { position: absolute; inset: 0; border-radius: 2rem; background: var(--muted); cursor: pointer; transition: .25s; }
    .slider::before { position: absolute; width: 1.15rem; height: 1.15rem; left: .2rem; bottom: .2rem; content: ""; border-radius: 50%; background: var(--bg); transition: .25s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(1.25rem); }

    .particle {
      position: fixed;
      top: -2rem;
      z-index: 10;
      pointer-events: none;
      color: #000;
      font-size: 1.2rem;
      animation: fall linear forwards;
    }

    [data-theme="aura"] .hero, [data-theme="aura"] .app-card, [data-theme="aura"] .icon-button, [data-theme="aura"] .social, [data-theme="aura"] .settings-panel {
      text-shadow: 0 0 10px #000;
      border-color: #000;
      box-shadow: 0 0 8px rgba(0, 0, 0, .78), 0 0 22px rgba(0, 0, 0, .28);
    }

    [data-theme="aura"] .melon {
      animation: aura-spin 1.7s linear infinite;
      box-shadow: 0 0 0 .12em #000, 0 0 10px rgba(0, 0, 0, .8);
    }

    .no-animations *, .no-animations *::before, .no-animations *::after {
      animation: none !important;
      scroll-behavior: auto !important;
      transition: none !important;
    }

    .no-animations .app-card:hover, .no-animations .app-card:focus-within,
    .no-animations .app-card:hover .arrow,
    .no-animations .icon-button:hover, .no-animations .social:hover,
    .no-animations .icon-button:focus-visible, .no-animations .social:focus-visible {
      transform: none;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bob { 0%, 100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(-4deg) translateY(-5px); } }
    @keyframes aura-spin { from { transform: rotate(-10deg); } to { transform: rotate(350deg); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0; } }

    @media (max-width: 680px) {
      .shell { width: min(100% - 1rem, 560px); padding-top: 2rem; }
      .apps { grid-template-columns: 1fr; }
      .hero { padding: 2rem 1.2rem; border-radius: 24px; }
      .section-heading { align-items: start; flex-direction: column; gap: .35rem; }
      .corner-tools { right: .7rem; bottom: .7rem; left: .7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

        moreTitle: "Más apps",
        more: "La lista sigue creciendo. Claro, si es que Cotton quiere trabajar...",
        settings: "Ajustes", theme: "Tema", language: "Idioma", aura: "Guardianes del Aura", disableAnimations: "Desactivar animaciones"
      },
      "pt-BR": {
        intro: "Ferramentas leves e eficientes, feitas com cuidado (e assistentes realmente obedientes), interfaces limpas e respeito pelo hardware do seu computador. Nada de bloatware com cara de Node: só apps úteis para sua máquina. Sua ventoinha agradece.",
        appsTitle: "Escolha um Melon, qualquer Melon",
        appsHint: "Tudo isso é grátis!",
        melange: "Um espaço focado para misturar ideias, notas, tarefas e faíscas de criatividade sem limites, tudo salvo localmente.",
        memory: "Um lugar tranquilo para guardar o que merece ser lembrado, sem alimentar uma nuvem misteriosa. Ideal para quem esquece das coisas rapidinho.",
        themeditor: "Ajuste cores, contraste e clima para criar seu próprio estilo de Melon. No fim, você leva um código para usar nos seus apps Melon favoritos.",
        moreTitle: "Mais em breve",
        more: "A cesta continua crescendo. Se o Cotton resolver levantar, é claro...",
        settings: "Configurações", theme: "Tema", language: "Idioma", aura: "Guardiões da Aura", disableAnimations: "Desativar animações"
      }
    };

    function applyLanguage(value) {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translations[value][element.dataset.i18n];
      });
      document.documentElement.lang = value;
      localStorage.setItem("melon-language", value);
    }

    function spawnParticle() {
      if (!aura.checked || disableAnimations.checked) return;
      const particle = document.createElement("span");
      particle.className = "particle";
      particle.textContent = ["✦", "✧", "·", "🍈", "!", "◌"][Math.floor(Math.random() * 6)];
      particle.style.left = `${Math.random() * 100}vw`;
      particle.style.animationDuration = `${.55 + Math.random() * .75}s`;
      particle.style.fontSize = `${.7 + Math.random() * 1.2}rem`;
      document.body.appendChild(particle);
      particle.addEventListener("animationend", () => particle.remove());
    }

    function applyTheme(value) {
      body.dataset.theme = value;
      if (value !== "aura") {
        theme.value = value;
        localStorage.setItem("melon-theme", value);
      }
    }

    settingsButton.addEventListener("click", () => {
      const open = settingsPanel.classList.toggle("open");
      settingsButton.setAttribute("aria-expanded", String(open));
    });

    theme.addEventListener("change", () => applyTheme(theme.value));
    language.addEventListener("change", () => applyLanguage(language.value));
    aura.addEventListener("change", () => {
      if (aura.checked) {
        localStorage.setItem("melon-theme-before-aura", body.dataset.theme);
        applyTheme("aura");
        for (let i = 0; i < 24; i += 1) setTimeout(spawnParticle, i * 55);
      } else {
        applyTheme(localStorage.getItem("melon-theme-before-aura") || theme.value);
      }
      localStorage.setItem("melon-aura", String(aura.checked));
    });

    disableAnimations.addEventListener("change", () => {
      body.classList.toggle("no-animations", disableAnimations.checked);
      localStorage.setItem("melon-disable-animations", String(disableAnimations.checked));
    });

    const storedTheme = localStorage.getItem("melon-theme");
    const availableThemes = ["light", "dark", "melon-light", "melon-dark", "crimson", "nebula", "eyeburn", "plum", "sand"];
    const savedTheme = storedTheme === "midnight" || !availableThemes.includes(storedTheme)
      ? "dark"
      : storedTheme;
    const savedLanguage = localStorage.getItem("melon-language") || "en";
    const savedAura = localStorage.getItem("melon-aura") === "true";
    const savedDisableAnimations = localStorage.getItem("melon-disable-animations") === "true";
    theme.value = savedTheme;
    applyTheme(savedAura ? "aura" : savedTheme);
    applyLanguage(savedLanguage);
    language.value = savedLanguage;
    aura.checked = savedAura;
    disableAnimations.checked = savedDisableAnimations;
    body.classList.toggle("no-animations", savedDisableAnimations);
    setInterval(spawnParticle, 145);
  </script>
</body>
</html>
