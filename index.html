<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Melon Project</title>
  <link rel="icon" href="i.png">
  <style>
    :root {
      --bg: #203b40;
      --src: #2f4e53;
      --str: #37636a;
      --txt: #fff8ef;
      --mut: #d3e1df;
      --line: #50605f;
      --acc: #ff974b;
      --shd: 10px 20px 60px #0716194d;
      --rad: 24px;
    }

    html { font-size: 110%; }

    [data-t="light"] {
      --bg: #e9eee7;
      --src: #f5f8f3;
      --str: #fff;
      --txt: #17231b;
      --mut: #607064;
      --line: #c7d0c8;
      --acc: #63bd46;
      --shd: 10px 20px 60px #28582a4d;
    }

    [data-t="dark"] {
      --bg: #111318;
      --src: #1c1f28;
      --str: #202430;
      --txt: #f4f5f7;
      --mut: #a5aab7;
      --line: #3f424b;
      --acc: #62c7b2;
      --shd: 10px 20px 60px #1113184d;
    }

    [data-t="mlt"] {
      --bg: #cfe9e5;
      --src: #fff8ee;
      --str: #fff;
      --txt: #3d2920;
      --mut: #866b5d;
      --line: #cdbeb5;
      --acc: #f28a3d;
      --shd: 10px 20px 60px #974f204d;
    }

    [data-t="mdk"] {
      --bg: #203b40;
      --src: #2f4e53;
      --str: #37636a;
      --txt: #fff8ef;
      --mut: #d3e1df;
      --line: #50605f;
      --acc: #ff974b;
      --shd: 10px 20px 60px #0716194d;
    }

    [data-t="crim"] {
      --bg: #17090f;
      --src: #340d1d;
      --str: #671b37;
      --txt: #fff3f6;
      --mut: #d8a8b8;
      --line: #7f334d;
      --acc: #ff4f7b;
      --shd: 10px 20px 60px #ff174f4d;
    }

    [data-t="nebu"] {
      --bg: #110d1f;
      --src: #261641;
      --str: #51318a;
      --txt: #f8f2ff;
      --mut: #c4aedc;
      --line: #765b99;
      --acc: #c783ff;
      --shd: 10px 20px 60px #a94dff4d;
    }

    [data-t="burn"] {
      --bg: #000;
      --src: #080808;
      --str: #111;
      --txt: #fff;
      --mut: #bcbcbc;
      --line: #aaaaaa;
      --acc: #fff;
      --shd: 10px 20px 60px #3333334d;
    }

    [data-t="aura"] {
      --bg: #fff;
      --src: #f0f0f0;
      --str: #fff;
      --txt: #000;
      --mut: #888;
      --line: #000;
      --acc: #000;
      --shd: 10px 20px 60px #0000004d;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--txt);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .4s ease, color .4s ease;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at 50% -10%, var(--acc) 0, var(--bg) 60rem);
      opacity: .25;
    }

    button, a { font: inherit; }

    a { color: inherit; text-decoration: none; }

    .shll {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(4rem, 10vw, 8rem) 0 7rem;
    }

    .hero {
      position: relative;
      padding: clamp(2rem, 6vw, 4.5rem);
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--src);
      box-shadow: var(--shd);
      backdrop-filter: blur(20px);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .hero::after {
      position: absolute;
      width: 16rem;
      height: 16rem;
      top: -10rem;
      right: -5rem;
      content: "";
      border-radius: 50%;
      background: var(--acc);
      opacity: .12;
      filter: blur(8px);
    }

    .brnd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      letter-spacing: -.02em;
      line-height: 1;
    }

    .mln {
      display: grid;
      width: 1.1em;
      height: 1.1em;
      place-items: center;
      font-size: .82em;
      border-radius: 30% 55% 34% 58%;
      background: var(--acc);
      box-shadow: 0 0 0 .12em var(--acc);
      transform: rotate(-10deg);
      animation: bob 4s ease-in-out infinite;
    }

    .intr {
      max-width: 650px;
      margin: 1.5rem auto 0;
      color: var(--mut);
      font-size: clamp(1rem, 2vw, 1.14rem);
      line-height: 1.7;
    }

    .hdg {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 3.5rem .25rem 1rem;
    }

    .hdg h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -.02em;
    }

    .hdg p {
      margin: 0;
      color: var(--mut);
      font-size: .82rem;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: 150px;
      padding: 1.35rem;
      border: 1px solid var(--line);
      border-radius: var(--rad);
      background: var(--src);
      box-shadow: 0 12px 35px #0000001f;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card:nth-child(2) { animation-delay: .08s; }
    .card:nth-child(3) { animation-delay: .16s; }
    .card:nth-child(4) { animation-delay: .24s; }
    .card:nth-child(5) { animation-delay: .32s; }
    .card:nth-child(6) { animation-delay: .4s; }

    .card:hover, .card:focus-within {
      border-color: var(--acc);
      background: var(--str);
      transform: translateY(-5px);
    }

    .icon {
      display: grid;
      width: 3.1rem;
      height: 3.1rem;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--acc);
      font-size: 1.45rem;
    }

    .card h3 { margin: 0 0 .4rem; font-size: 1.08rem; }
    .card p { max-width: 28ch; margin: 0; color: var(--mut); font-size: .9rem; line-height: 1.45; }

    .arrw {
      color: var(--acc);
      font-size: 1.3rem;
      transition: transform .25s ease;
    }

    .card:hover .arrw { transform: translateX(4px); }

    .tools {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      left: 1.25rem;
      z-index: 5;
      display: flex;
      align-items: end;
      justify-content: space-between;
      pointer-events: none;
    }

    .socs { display: flex; flex-direction: column; gap: .55rem; }

    .wrap { position: relative; }

    .socs, .wrap { pointer-events: auto; }

    .btn, .soc {
      display: grid;
      width: 3.18rem;
      height: 3.18rem;
      place-items: center;
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--src);
      box-shadow: 0 10px 28px #0000002e;
      cursor: pointer;
      transition: transform .2s ease, color .2s ease, border-color .2s ease;
      backdrop-filter: blur(12px);
    }

    .btn:hover, .soc:hover, .btn:focus-visible, .soc:focus-visible {
      color: var(--acc);
      border-color: var(--acc);
      outline: none;
      transform: translateY(-3px);
    }

    .btn { font-size: 1.18rem; }
    .soc svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }

    .pnl {
      position: absolute;
      right: 0;
      bottom: 3.5rem;
      width: min(330px, calc(100vw - 2.5rem));
      padding: 1.2rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--str);
      box-shadow: var(--shd);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(.97);
      transform-origin: bottom right;
      transition: opacity .2s ease, transform .2s ease;
    }

    .pnl.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .pnl h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    .set { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--line); }
    .set label, .set span { font-size: .88rem; }

    select {
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: .45rem .55rem;
      background: var(--src);
    }

    .swch { position: relative; width: 2.8rem; height: 1.55rem; }
    .swch input { width: 0; height: 0; opacity: 0; }
    .sld { position: absolute; inset: 0; border-radius: 2rem; background: var(--mut); cursor: pointer; transition: .25s; }
    .sld::before { position: absolute; width: 1.15rem; height: 1.15rem; left: .2rem; bottom: .2rem; content: ""; border-radius: 50%; background: var(--bg); transition: .25s; }
    .swch input:checked + .sld { background: var(--acc); }
    .swch input:checked + .sld::before { transform: translateX(1.25rem); }

    .prt {
      position: fixed;
      top: -2rem;
      z-index: 10;
      pointer-events: none;
      color: #000;
      font-size: 1.2rem;
      animation: fall linear forwards;
    }

    [data-t="aura"] .hero, [data-t="aura"] .card, [data-t="aura"] .btn, [data-t="aura"] .soc, [data-t="aura"] .pnl {
      text-shadow: 0 0 10px #000;
      border-color: #000;
      box-shadow: 0 0 8px #000000c7, 0 0 22px #00000047;
    }

    [data-t="aura"] .mln {
      animation: spin 1.7s linear infinite;
      box-shadow: 0 0 0 .12em #000, 0 0 10px #000000cc;
    }

    .noa *, .noa *::before, .noa *::after {
      animation: none !important;
      scroll-behavior: auto !important;
      transition: none !important;
    }

    .noa .card:hover, .noa .card:focus-within,
    .noa .card:hover .arrw,
    .noa .btn:hover, .noa .soc:hover,
    .noa .btn:focus-visible, .noa .soc:focus-visible {
      transform: none;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bob { 0%, 100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(-4deg) translateY(-5px); } }
    @keyframes spin { from { transform: rotate(-10deg); } to { transform: rotate(350deg); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0; } }

    @media (max-aspect-ratio: 1/1), (max-width: 680px) {
      .shll { padding-bottom: 1.75rem; }
      .tools {
        position: relative;
        right: auto;
        bottom: auto;
        left: auto;
        width: min(920px, calc(100% - 2rem));
        margin: 0 auto 2rem;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem;
        pointer-events: auto;
      }
      .socs { flex-direction: row; flex-wrap: wrap; gap: .45rem; }
      .btn, .soc { width: 2.75rem; height: 2.75rem; border-radius: 12px; }
      .pnl { bottom: 3.25rem; width: min(330px, calc(100vw - 1rem)); }
    }

    @media (max-width: 680px) {
      .shll, .tools { width: min(100% - 1rem, 560px); }
      .shll { padding-top: 2rem; }
      .apps { grid-template-columns: 1fr; }
      .hero { padding: 2rem 1.2rem; border-radius: 24px; }
      .hdg { align-items: start; flex-direction: column; gap: .35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

        mem: "Un lugar tranquilo para llevar rastro de tus recuerdos antes que se te olviden. Ideal para personas con problemas de memoria a corto plazo.",
        thm: "Ajusta colores, contraste y ambiente para crear tu propio estilo de Melon. Esto te dará un código que puedes utilizar en tus apps de Melon favoritas.",
        tam: "Crea temporizadores de cocina o entrenamiento para organizar cuándo moverte y cuándo domar tu tiempo. Y dile adiós a esas horribles apps de la Play Store llenas de anuncios que devoran tu cartera.",
        sor: "El clásico juego de la dulce venganza, pero ahora aún más dulce con nuestro código ligero y gratuito. ¡Haz que tus momentos memorables con amigos sean un poco más jugosos!",
        moreT: "Más apps",
        more: "La lista sigue creciendo. Claro, si es que Cotton quiere trabajar...",
        set: "Ajustes", thmL: "Tema", langL: "Idioma", auraL: "Guardianes del Aura", noaL: "Desactivar animaciones"
      },
      "pt-BR": {
        intro: "Ferramentas leves e eficientes, feitas com cuidado (e assistentes realmente obedientes), interfaces limpas e respeito pelo hardware do seu computador. Nada de bloatware com cara de Node: só apps úteis para sua máquina. Sua ventoinha agradece.",
        h2: "Escolha um Melon, qualquer Melon",
        hint: "Tudo isso é grátis!",
        mel: "Um espaço focado para misturar ideias, notas, tarefas e faíscas de criatividade sem limites, tudo salvo localmente.",
        mem: "Um lugar tranquilo para guardar o que merece ser lembrado, sem alimentar uma nuvem misteriosa. Ideal para quem esquece das coisas rapidinho.",
        thm: "Ajuste cores, contraste e clima para criar seu próprio estilo de Melon. No fim, você leva um código para usar nos seus apps Melon favoritos.",
        tam: "Crie timers de cozinha ou treino para organizar quando se mexer e quando domar o seu tempo. E dê adeus àqueles apps horríveis da Play Store cheios de anúncios que devoram sua carteira.",
        sor: "O clássico jogo da doce vingança, mas agora ainda mais doce com nosso código leve e gratuito. Deixe seus momentos memoráveis com os amigos um pouco mais suculentos!",
        moreT: "Mais em breve",
        more: "A cesta continua crescendo. Se o Cotton resolver levantar, é claro...",
        set: "Configurações", thmL: "Tema", langL: "Idioma", auraL: "Guardiões da Aura", noaL: "Desactivar animações"
      }
    };

    function opts() {
      thm.querySelectorAll('option[value^="own:"]').forEach((el) => el.remove());
      Object.entries(cst).forEach(([k, item]) => {
        const opt = document.createElement("option");
        opt.value = `own:${k}`;
        opt.textContent = item.name;
        thm.appendChild(opt);
      });
    }

    function setL(v) {
      document.querySelectorAll("[data-i]").forEach((el) => {
        el.textContent = tr[v][el.dataset.i];
      });
      document.documentElement.lang = v;
      localStorage.setItem("melon-language", v);
    }

    function drop() {
      if (!aura.checked || noa.checked) return;
      const p = document.createElement("span");
      p.className = "prt";
      p.textContent = ["✦", "✧", "·", "🍈", "!", "◌"][Math.floor(Math.random() * 6)];
      p.style.left = `${Math.random() * 100}vw`;
      p.style.animationDuration = `${.55 + Math.random() * .75}s`;
      p.style.fontSize = `${.7 + Math.random() * 1.2}rem`;
      b.appendChild(p);
      p.addEventListener("animationend", () => p.remove());
    }

    function setT(v) {
      const map = { bg: "bg", src: "surface", str: "surface-strong", txt: "text", mut: "muted", line: "line", acc: "accent", shd: "shadow" };
      const own = v.startsWith("own:") ? cst[v.slice(4)] : null;
      b.dataset.t = own ? "cst" : v;
      ["bg", "src", "str", "txt", "mut", "line", "acc"].forEach((k) => {
        b.style.removeProperty(`--${k}`);
        const val = own?.values[k] || own?.values[map[k]];
        if (val) b.style.setProperty(`--${k}`, val);
      });
      b.style.removeProperty("--shd");
      if (own) {
        const s = own.values.shd || own.values.shadow;
        b.style.setProperty("--shd", s
          ? s.replace(/^(-?\d+)\s+(-?\d+)\s+(\d+)\s+#?([0-9a-f]{8})$/i, "$1px $2px $3px #$4")
          : "10px 20px 60px #0000004d");
        thm.value = v;
        localStorage.setItem("melon-theme", v);
      } else if (v !== "aura") {
        thm.value = v;
        localStorage.setItem("melon-theme", v);
      }
    }

    btn.addEventListener("click", () => {
      const open = pnl.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
    });

    thm.addEventListener("change", () => setT(thm.value));
    lang.addEventListener("change", () => setL(lang.value));
    aura.addEventListener("change", () => {
      if (aura.checked) {
        localStorage.setItem("melon-theme-before-aura", thm.value);
        setT("aura");
        for (let i = 0; i < 24; i += 1) setTimeout(drop, i * 55);
      } else {
        setT(localStorage.getItem("melon-theme-before-aura") || thm.value);
      }
      localStorage.setItem("melon-aura", String(aura.checked));
    });

    noa.addEventListener("change", () => {
      b.classList.toggle("noa", noa.checked);
      localStorage.setItem("melon-disable-animations", String(noa.checked));
    });

    window.addEventListener("storage", (e) => {
      if (e.key === "themeditor-themes") {
        cst = JSON.parse(e.newValue || "{}");
        const cur = thm.value;
        opts();
        if (cur.startsWith("own:") && !cst[cur.slice(4)]) setT("mdk");
        else if (!aura.checked) setT(cur);
      }
    });

    opts();

    const mapT = { "melon-light": "mlt", "melon-dark": "mdk", "crimson": "crim", "nebula": "nebu", "eyeburn": "burn" };
    const rawT = localStorage.getItem("melon-theme");
    const sThm = mapT[rawT] || rawT;
    const aThm = ["light", "dark", "mlt", "mdk", "crim", "nebu", "burn"];
    const vThm = !sThm
      ? "mdk"
      : (!aThm.includes(sThm) && !cst[sThm.slice(4)])
        ? "dark"
        : sThm;
    const vLang = localStorage.getItem("melon-language") || "en";
    const vAura = localStorage.getItem("melon-aura") === "true";
    const vNoa = localStorage.getItem("melon-disable-animations") === "true";

    thm.value = vThm;
    setT(vAura ? "aura" : vThm);
    setL(vLang);
    lang.value = vLang;
    aura.checked = vAura;
    noa.checked = vNoa;
    b.classList.toggle("noa", vNoa);
    setInterval(drop, 145);
  </script>
</body>
</html>
