<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <style>
        :root {
            --bg-top: #111318;
            --bg-bottom: #111318;
            --card: rgba(28, 31, 40, 0.92);
            --text: #f4f5f7;
            --muted: #a5aab7;
            --accent: #62c7b2;
            --border: rgba(255, 255, 255, 0.13);
            --sidebar: rgba(28, 31, 40, 0.94);
            --glass-blur: blur(18px);
        }

        body.light {
            --bg-top: #e9eee7;
            --bg-bottom: #e9eee7;
            --card: rgba(255, 255, 255, 0.9);
            --text: #17231b;
            --accent: #63bd46;
            --border: rgba(23, 35, 27, 0.15);
            --sidebar: rgba(255, 255, 255, 0.95);
        }

        body.dark {
            --bg-top: #111318;
            --bg-bottom: #111318;
            --card: rgba(28, 31, 40, 0.92);
            --text: #f4f5f7;
            --accent: #62c7b2;
            --border: rgba(255, 255, 255, 0.13);
            --sidebar: rgba(28, 31, 40, 0.94);
        }

        body.melonlight {
            --bg-top: #cfe9e5;
            --bg-bottom: #cfe9e5;
            --card: rgba(255, 251, 245, 0.92);
            --text: #3d2920;
            --accent: #f28a3d;
            --border: rgba(61, 41, 32, 0.15);
            --sidebar: rgba(255, 251, 245, 0.95);
        }

        body.melon {
            --bg-top: #203b40;
            --bg-bottom: #203b40;
            --card: rgba(47, 79, 84, 0.94);
            --text: #fff8ef;
            --accent: #ff974b;
            --border: rgba(255, 248, 239, 0.2);
            --sidebar: rgba(47, 79, 84, 0.96);
        }

        body.redspace {
            --bg-top: #17090f;
            --bg-bottom: #17090f;
            --card: rgba(52, 13, 29, 0.92);
            --text: #fff3f6;
            --accent: #ff4f7b;
            --border: rgba(255, 105, 145, 0.32);
            --sidebar: rgba(52, 13, 29, 0.96);
        }

        body.purplespace {
            --bg-top: #110d1f;
            --bg-bottom: #110d1f;
            --card: rgba(38, 22, 65, 0.92);
            --text: #f8f2ff;
            --accent: #c783ff;
            --border: rgba(194, 131, 255, 0.3);
            --sidebar: rgba(38, 22, 65, 0.96);
        }

        body.eyeburn {
            --bg-top: #000000;
            --bg-bottom: #000000;
            --card: rgba(17, 17, 19, 0.85);
            --text: #ffffff;
            --accent: #ffffff;
            --border: #555555;
            --sidebar: rgba(0, 0, 0, 0.9);
        }

        body.plum {
            --bg-top: #17121d;
            --bg-bottom: #17121d;
            --card: rgba(39, 27, 49, 0.92);
            --text: #f4eafa;
            --accent: #7affc6;
            --border: rgba(255, 255, 255, 0.14);
            --sidebar: rgba(39, 27, 49, 0.96);
        }

        body.sand {
            --bg-top: #171614;
            --bg-bottom: #171614;
            --card: rgba(45, 39, 31, 0.92);
            --text: #f7eee2;
            --accent: #ffd166;
            --border: rgba(255, 238, 214, 0.16);
            --sidebar: rgba(45, 39, 31, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 42rem), var(--bg-top);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.2;
            background-image: linear-gradient(color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, #000, transparent 88%);
        }

        .top-actions {
            position: fixed;
            display: flex;
            gap: 1rem;
            z-index: 50;
            transition: all 0.2s ease;
        }

        .top-actions.top-left {
            top: 1.5rem;
            left: 2rem;
        }

        .top-actions.top-right {
            top: 1.5rem;
            right: 2rem;
        }

        .top-actions.bottom-left {
            bottom: 1.5rem;
            left: 2rem;
        }

        .top-actions.bottom-right {
            bottom: 1.5rem;
            right: 2rem;
        }

        .icon-btn {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.5rem;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, color 0.2s;
            box-shadow: 0 10px 28px rgba(0,0,0,.18);
        }

        .icon-btn:hover, .action-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        #menu-btn {
            position: relative;
        }

        .thought-count {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 23px;
            height: 23px;
            padding: 0 6px;
            border: 2px solid var(--card);
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .72rem;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
        }

        .thought-count:empty {
            display: none;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        .input-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.5rem;
            border-radius: 20px;
            font-size: 1.25rem;
            resize: none;
            outline: none;
            box-shadow: 0 14px 34px rgba(0,0,0,.18);
            transition: border-color 0.2s, box-shadow 0.2s, transform .2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 16px 36px rgba(0,0,0,.2);
        }

        textarea.glow {
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent);
        }

        .submit-btn {
            width: 144px;
            height: 144px;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 48px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
            box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            border-radius: 36px 36px 0 0;
            pointer-events: none;
        }

        .submit-btn svg {
            width: 64px;
            height: 64px;
            fill: currentColor;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .submit-btn:active {
            transform: scale(0.92);
        }

        .fullscreen-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 3rem;
        }

        .fullscreen-menu.open {
            transform: translateY(0);
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .menu-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .thoughts-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 2rem;
        }

        .thought-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 12px 28px rgba(0,0,0,.14);
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }

        .thought-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(0,0,0,.2);
        }

        .search-wrap {
            max-width: 800px;
            width: 100%;
            margin: 0 auto 2.25rem;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: .9rem 1rem .9rem 3rem;
            border-radius: 14px;
        }

        .search-wrap::before {
            content: '⌕';
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-52%);
            color: var(--accent);
            font-size: 1.5rem;
            z-index: 1;
            pointer-events: none;
        }

        .thought-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .thought-title {
            font-weight: 600;
            font-size: calc(1.15rem + 2px);
            color: var(--text);
        }

        .thought-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .thought-date {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .thought-actions {
            display: flex;
            gap: 0.75rem;
        }

        .thought-color-menu {
            position: fixed;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            width: 154px;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--sidebar);
            box-shadow: 0 12px 30px rgba(0,0,0,.28);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 250;
        }

        .thought-color-option {
            width: 23px;
            height: 23px;
            padding: 0;
            border: 2px solid color-mix(in srgb, var(--text) 18%, transparent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform .15s, border-color .15s;
        }

        .thought-color-option:hover {
            border-color: var(--text);
            transform: scale(1.14);
        }

        .thought-color-option.none {
            background: var(--card);
            position: relative;
        }

        .thought-color-option.none::after {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 10px;
            height: 2px;
            background: #e05252;
            transform: rotate(-45deg);
        }

        .action-btn.color {
            color: var(--accent);
        }

        .action-btn {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, color 0.2s;
        }

        .action-btn svg {
            width: 25px;
            height: 25px;
            fill: currentColor;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn.delete {
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.3);
        }

        .action-btn.save {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .settings-content {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex: 1;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .setting-group label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        select, input {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.05rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .editor-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .editor-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .editor-box {
            background: var(--sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 650px;
            height: 80vh;
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .editor-overlay.open .editor-box {
            transform: scale(1) translateY(0);
        }

        .editor-textarea {
            flex: 1;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.5rem;
            border-radius: 16px;
            font-size: 1.15rem;
            resize: none;
            outline: none;
        }

        .editor-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .save-toast {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            z-index: 300;
            padding: .8rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            box-shadow: 0 12px 30px rgba(0,0,0,.24);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity .2s, transform .2s;
        }

        .save-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body class="dark">

    <div class="top-actions top-left" id="action-buttons">
        <button class="icon-btn" id="menu-btn" title="Thoughts">
            ☰
            <span class="thought-count" id="thought-count" aria-label="Saved thoughts"></span>
        </button>
        <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
    </div>

    <main>
        <div class="input-container">
            <textarea id="thought-input" placeholder="What's on your mind?"></textarea>
            <button class="submit-btn" id="submit-btn" title="Save Thought">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
            </button>
        </div>
    </main>

    <div class="fullscreen-menu" id="thoughts-menu">
        <div class="menu-header">
            <span class="menu-title">Thoughts</span>
            <button class="icon-btn" id="close-thoughts">✕</button>
        </div>
        <div class="search-wrap">
            <input type="search" id="thought-search" placeholder="Search your thoughts..." autocomplete="off">
        </div>
        <div class="thoughts-list" id="thoughts-list">
        </div>
    </div>

    <div class="fullscreen-menu" id="settings-menu">
        <div class="menu-header">
            <span class="menu-title">Settings</span>
            <button class="icon-btn" id="close-settings">✕</button>
        </div>
        <div class="settings-content">
            <div class="setting-group">
                <label for="theme-select">Themes</label>
                <select id="theme-select">
                    <option value="light">☀ Light</option>
                    <option value="dark" selected>☾ Dark</option>
                    <option value="melonlight">☀ Melon Light</option>
                    <option value="melon">☾ Melon Dark</option>
                    <option value="redspace">☾ Crimson</option>
                    <option value="purplespace">☾ Nebula</option>
                    <option value="eyeburn">☾ Eyeburn</option>
                    <option value="plum">☾ Plum</option>
                    <option value="sand">☾ Sand</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="input-mode">Aura Farming</label>
                <select id="input-mode">
                    <option value="keyboard">Disabled</option>
                    <option value="speech">Enabled</option>
                    <option value="both">Sigma</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="menu-position">Menu & Settings Position</label>
                <select id="menu-position">
                    <option value="top-left">Top Left</option>
                    <option value="top-right">Top Right</option>
                    <option value="bottom-left">Bottom Left</option>
                    <option value="bottom-right">Bottom Right</option>
                </select>
            </div>
        </div>
    </div>

    <div class="editor-overlay" id="editor-overlay">
        <div class="editor-box">
            <div class="menu-header" style="margin-bottom:0;">
                <span class="menu-title">Edit Thought</span>
                <button class="icon-btn" id="editor-cancel">✕</button>
            </div>

            <div class="save-toast" id="save-toast" role="status" aria-live="polite">Thought saved to Thoughts</div>
            <textarea class="editor-textarea" id="editor-textarea"></textarea>
            <div class="editor-footer">
                <button class="action-btn" id="editor-cancel-btn" title="Cancel">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                </button>
                <button class="action-btn save" id="editor-save-btn" title="Save">
                    <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let thoughts = JSON.parse(localStorage.getItem('melon_memories') || '[]');
        let settings = JSON.parse(localStorage.getItem('melon_mem_settings') || JSON.stringify({
            theme: 'dark',
            inputMode: 'keyboard',
            menuPosition: 'top-left'
        }));

        let editingIndex = null;

        const body = document.body;
        const textarea = document.getElementById('thought-input');
        const submitBtn = document.getElementById('submit-btn');
        const thoughtsMenu = document.getElementById('thoughts-menu');
        const settingsMenu = document.getElementById('settings-menu');
        const editorOverlay = document.getElementById('editor-overlay');
        const editorTextarea = document.getElementById('editor-textarea');
        const thoughtsList = document.getElementById('thoughts-list');
        const thoughtSearch = document.getElementById('thought-search');
        const thoughtCount = document.getElementById('thought-count');
        const saveToast = document.getElementById('save-toast');
        const themeSelect = document.getElementById('theme-select');
        const inputModeSelect = document.getElementById('input-mode');
        const menuPosSelect = document.getElementById('menu-position');
        const actionButtons = document.getElementById('action-buttons');
        let toastTimer = null;

        function updateThoughtCount() {
            thoughtCount.textContent = thoughts.length ? thoughts.length : '';
            thoughtCount.setAttribute('aria-label', `${thoughts.length} saved thought${thoughts.length === 1 ? '' : 's'}`);
        }

        function showSaveToast() {
            clearTimeout(toastTimer);
            saveToast.classList.add('show');
            toastTimer = setTimeout(() => saveToast.classList.remove('show'), 2200);
        }

        function applySettings() {
            body.className = settings.theme;
            themeSelect.value = settings.theme;
            inputModeSelect.value = settings.inputMode;
            menuPosSelect.value = settings.menuPosition;

            actionButtons.className = `top-actions ${settings.menuPosition}`;
        }

        function saveSettings() {
            settings.theme = themeSelect.value;
            settings.inputMode = inputModeSelect.value;
            settings.menuPosition = menuPosSelect.value;
            localStorage.setItem('melon_mem_settings', JSON.stringify(settings));
            applySettings();
        }

        function renderThoughts() {
            thoughtsList.innerHTML = '';
            const query = thoughtSearch.value.trim().toLowerCase();
            const visibleThoughts = thoughts
                .map((thought, index) => ({ thought, index }))
                .filter(({ thought }) => !query || `${thought.text} ${thought.date}`.toLowerCase().includes(query));

            if (visibleThoughts.length === 0) {
                const message = thoughts.length === 0 ? 'No thoughts recorded yet...' : 'No thoughts match that search...';
                thoughtsList.innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:3rem; font-size: 1.1rem;">${message}</div>`;
                return;
            }

            visibleThoughts.forEach(({ thought, index }) => {
                const words = thought.text.trim().split(/\s+/);
                const title = words.length > 0 ? (words.slice(0, 3).join(' ') + (words.length > 3 ? '...' : '')) : 'Empty thought...';
                
                const card = document.createElement('div');
                card.className = 'thought-card';
                applyThoughtColor(card, thought.color);
                card.innerHTML = `
                    <div class="thought-header-row">
                        <span class="thought-title">${escapeHtml(title)}</span>
                    </div>
                    <div class="thought-footer-row">
                        <span class="thought-date">${thought.date}</span>
                        <div class="thought-actions">
                            <button class="action-btn" onclick="openEditor(${index})" title="Edit">
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
                            </button>
                            <button class="action-btn color" onclick="openColorMenu(${index}, event)" title="Color code">
                                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-4a2 2 0 0 1-2-2V8a5 5 0 0 0-5-5z" fill="currentColor"/><circle cx="7.5" cy="12" r="1" fill="var(--card)"/><circle cx="10" cy="7.5" r="1" fill="var(--card)"/><circle cx="15" cy="7.5" r="1" fill="var(--card)"/></svg>
                            </button>
                            <button class="action-btn delete" onclick="deleteThought(${index})" title="Delete">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                thoughtsList.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        const thoughtColors = {
            none: null,
            red: '#d03040',
            orange: '#f07000',
            yellow: '#ffba00',
            lime: '#a0c000',
            green: '#209080',
            cyan: '#0090c0',
            blue: '#0050b0',
            purple: '#6010b0',
            pink: '#e02090'
        };

        function applyThoughtColor(card, color) {
            const hex = thoughtColors[color];
            if (!hex) return;
            card.style.background = `color-mix(in srgb, ${hex} 12%, var(--card))`;
            card.style.borderColor = `color-mix(in srgb, ${hex} 32%, var(--border))`;
        }

        window.openColorMenu = function(index, event) {
            const old = document.querySelector('.thought-color-menu');
            if (old) old.remove();

            const menu = document.createElement('div');
            menu.className = 'thought-color-menu';
            const colors = Object.entries(thoughtColors);
            colors.forEach(([name, hex]) => {
                const option = document.createElement('button');
                option.className = `thought-color-option${name === 'none' ? ' none' : ''}`;
                option.type = 'button';
                option.title = name === 'none' ? 'No color' : name;
                if (hex) option.style.background = `color-mix(in srgb, ${hex} 70%, var(--card))`;
                option.onclick = () => {
                    thoughts[index].color = name;
                    localStorage.setItem('melon_memories', JSON.stringify(thoughts));
                    menu.remove();
                    renderThoughts();
                };
                menu.appendChild(option);
            });

            const rect = event.currentTarget.getBoundingClientRect();
            menu.style.left = `${Math.min(rect.left, innerWidth - 170)}px`;
            menu.style.top = `${Math.min(rect.bottom + 8, innerHeight - 120)}px`;
            document.body.appendChild(menu);
            setTimeout(() => {
                const close = (outsideEvent) => {
                    if (!menu.contains(outsideEvent.target) && outsideEvent.target !== event.currentTarget) {
                        menu.remove();
                        window.removeEventListener('click', close);
                    }
                };
                window.addEventListener('click', close);
            }, 0);
        };

        function addThought() {
            const text = textarea.value.trim();
            if (!text) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            thoughts.unshift({ text, date: dateStr, color: 'none' });
            localStorage.setItem('melon_memories', JSON.stringify(thoughts));
            updateThoughtCount();
            showSaveToast();

            textarea.value = '';
            textarea.classList.add('glow');
            submitBtn.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                textarea.classList.remove('glow');
                submitBtn.style.transform = 'scale(1)';
            }, 300);

            renderThoughts();
        }

        window.deleteThought = function(index) {
            thoughts.splice(index, 1);
            localStorage.setItem('melon_memories', JSON.stringify(thoughts));
            updateThoughtCount();
            renderThoughts();
        }

        window.openEditor = function(index) {
            editingIndex = index;
            editorTextarea.value = thoughts[index].text;
            editorOverlay.classList.add('open');
        }

        function closeEditor() {
            editorOverlay.classList.remove('open');
            editingIndex = null;
        }

        function saveEditedThought() {
            if (editingIndex !== null) {
                thoughts[editingIndex].text = editorTextarea.value.trim();
                localStorage.setItem('melon_memories', JSON.stringify(thoughts));
                renderThoughts();
                closeEditor();
            }
        }

        document.getElementById('menu-btn').onclick = () => { thoughtsMenu.classList.add('open'); renderThoughts(); };
        document.getElementById('settings-btn').onclick = () => settingsMenu.classList.add('open');

        submitBtn.onclick = addThought;
        
        document.getElementById('close-thoughts').onclick = () => thoughtsMenu.classList.remove('open');
        document.getElementById('close-settings').onclick = () => settingsMenu.classList.remove('open');

        document.getElementById('editor-cancel').onclick = closeEditor;
        document.getElementById('editor-cancel-btn').onclick = closeEditor;
        document.getElementById('editor-save-btn').onclick = saveEditedThought;

        themeSelect.onchange = saveSettings;
        inputModeSelect.onchange = saveSettings;
        menuPosSelect.onchange = saveSettings;
        thoughtSearch.oninput = renderThoughts;

        updateThoughtCount();
        applySettings();
    </script>
</body>
</html>
