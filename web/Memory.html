<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="icon" href="memory.png">
    <style>
        :root {
            --bg-top: #111318;
            --bg-bottom: #111318;
            --card: rgba(28, 31, 40, 0.92);
            --text: #f4f5f7;
            --muted: #a5aab7;
            --accent: #62c7b2;
            --border: rgba(255, 255, 255, 0.13);
            --sidebar: rgba(28, 31, 40, 0.94);
            --glass-blur: blur(18px);
        }

        body.lgt {
            --bg-top: #e9eee7;
            --bg-bottom: #e9eee7;
            --card: rgba(255, 255, 255, 0.9);
            --text: #17231b;
            --accent: #63bd46;
            --border: rgba(23, 35, 27, 0.15);
            --sidebar: rgba(255, 255, 255, 0.95);
        }

        body.drk {
            --bg-top: #111318;
            --bg-bottom: #111318;
            --card: rgba(28, 31, 40, 0.92);
            --text: #f4f5f7;
            --accent: #62c7b2;
            --border: rgba(255, 255, 255, 0.13);
            --sidebar: rgba(28, 31, 40, 0.94);
        }

        body.mlgt {
            --bg-top: #cfe9e5;
            --bg-bottom: #cfe9e5;
            --card: rgba(255, 251, 245, 0.92);
            --text: #3d2920;
            --accent: #f28a3d;
            --border: rgba(61, 41, 32, 0.15);
            --sidebar: rgba(255, 251, 245, 0.95);
        }

        body.mln {
            --bg-top: #203b40;
            --bg-bottom: #203b40;
            --card: rgba(47, 79, 84, 0.94);
            --text: #fff8ef;
            --accent: #ff974b;
            --border: rgba(255, 248, 239, 0.2);
            --sidebar: rgba(47, 79, 84, 0.96);
        }

        body.red {
            --bg-top: #17090f;
            --bg-bottom: #17090f;
            --card: rgba(52, 13, 29, 0.92);
            --text: #fff3f6;
            --accent: #ff4f7b;
            --border: rgba(255, 105, 145, 0.32);
            --sidebar: rgba(52, 13, 29, 0.96);
        }

        body.prp {
            --bg-top: #110d1f;
            --bg-bottom: #110d1f;
            --card: rgba(38, 22, 65, 0.92);
            --text: #f8f2ff;
            --accent: #c783ff;
            --border: rgba(194, 131, 255, 0.3);
            --sidebar: rgba(38, 22, 65, 0.96);
        }

        body.eyb {
            --bg-top: #000000;
            --bg-bottom: #000000;
            --card: rgba(17, 17, 19, 0.85);
            --text: #ffffff;
            --accent: #ffffff;
            --border: #555555;
            --sidebar: rgba(0, 0, 0, 0.9);
        }

        body.plm {
            --bg-top: #17121d;
            --bg-bottom: #17121d;
            --card: rgba(39, 27, 49, 0.92);
            --text: #f4eafa;
            --accent: #7affc6;
            --border: rgba(255, 255, 255, 0.14);
            --sidebar: rgba(39, 27, 49, 0.96);
        }

        body.snd {
            --bg-top: #171614;
            --bg-bottom: #171614;
            --card: rgba(45, 39, 31, 0.92);
            --text: #f7eee2;
            --accent: #ffd166;
            --border: rgba(255, 238, 214, 0.16);
            --sidebar: rgba(45, 39, 31, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 42rem), var(--bg-top);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.2;
            background-image: linear-gradient(color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--text) 8%, transparent) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, #000, transparent 88%);
        }

        .acts {
            position: fixed;
            display: flex;
            gap: 1rem;
            z-index: 50;
            transition: all 0.2s ease;
        }

        .acts.tl {
            top: 1.5rem;
            left: 2rem;
        }

        .acts.tr {
            top: 1.5rem;
            right: 2rem;
        }

        .acts.bl {
            bottom: 1.5rem;
            left: 2rem;
        }

        .acts.br {
            bottom: 1.5rem;
            right: 2rem;
        }

        .ibtn {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.5rem;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, color 0.2s;
            box-shadow: 0 10px 28px rgba(0,0,0,.18);
        }

        .ibtn:hover, .abtn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }

        .ibtn:active {
            transform: scale(0.92);
        }

        #mbtn {
            position: relative;
        }

        .tcnt {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 23px;
            height: 23px;
            padding: 0 6px;
            border: 2px solid var(--card);
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .72rem;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
        }

        .tcnt:empty {
            display: none;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        .icnt {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.5rem;
            border-radius: 20px;
            font-size: 1.25rem;
            resize: none;
            outline: none;
            box-shadow: 0 14px 34px rgba(0,0,0,.18);
            transition: border-color 0.2s, box-shadow 0.2s, transform .2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 16px 36px rgba(0,0,0,.2);
        }

        textarea.glow {
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent);
        }

        .suggs {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
            min-height: 38px;
            flex-wrap: wrap;
        }

        .sbtn {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sbtn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }

        .sbtn:active {
            transform: scale(0.95);
        }

        .sbtn:empty {
            display: none;
        }

        .sbtn {
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 48px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
            box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .subtn {
            width: 144px;
            height: 144px;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 48px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
            box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .subtn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            border-radius: 36px 36px 0 0;
            pointer-events: none;
        }

        .subtn svg {
            width: 64px;
            height: 64px;
            fill: currentColor;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .subtn:active {
            transform: scale(0.92);
        }

        .fmenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 3rem;
        }

        .fmenu.open {
            transform: translateY(0);
        }

        .mhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .mtitl {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .tlst {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 2rem;
        }

        .tcard {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 12px 28px rgba(0,0,0,.14);
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }

        .tcard:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(0,0,0,.2);
        }

        .swrap {
            max-width: 800px;
            width: 100%;
            margin: 0 auto 2.25rem;
            position: relative;
        }

        .swrap input {
            width: 100%;
            padding: .9rem 1rem .9rem 3rem;
            border-radius: 14px;
        }

        .swrap::before {
            content: '⌕';
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-52%);
            color: var(--accent);
            font-size: 1.5rem;
            z-index: 1;
            pointer-events: none;
        }

        .trow1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ttitl {
            font-weight: 600;
            font-size: calc(1.15rem + 2px);
            color: var(--text);
        }

        .trow2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .tdate {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .tacts {
            display: flex;
            gap: 0.75rem;
        }

        .cmenu {
            position: fixed;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            width: 154px;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--sidebar);
            box-shadow: 0 12px 30px rgba(0,0,0,.28);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 250;
        }

        .copt {
            width: 23px;
            height: 23px;
            padding: 0;
            border: 2px solid color-mix(in srgb, var(--text) 18%, transparent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform .15s, border-color .15s;
        }

        .copt:hover {
            border-color: var(--text);
            transform: scale(1.14);
        }

        .copt.none {
            background: var(--card);
            position: relative;
        }

        .copt.none::after {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 10px;
            height: 2px;
            background: #e05252;
            transform: rotate(-45deg);
        }

        .abtn.color {
            color: var(--accent);
        }

        .abtn {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, color 0.2s;
        }

        .abtn svg {
            width: 25px;
            height: 25px;
            fill: currentColor;
        }

        .abtn:active {
            transform: scale(0.92);
        }

        .abtn.del {
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.3);
        }

        .abtn.save {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .sctnt {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex: 1;
        }

        .sgrp {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sgrp label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        select, input {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.05rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .edovr {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .edovr.open {
            opacity: 1;
            pointer-events: auto;
        }

        .edbox {
            background: var(--sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 650px;
            height: 80vh;
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .edovr.open .edbox {
            transform: scale(1) translateY(0);
        }

        .edtxt {
            flex: 1;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.5rem;
            border-radius: 16px;
            font-size: 1.15rem;
            resize: none;
            outline: none;
        }

        .edftr {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            z-index: 300;
            padding: .8rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            box-shadow: 0 12px 30px rgba(0,0,0,.24);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity .2s, transform .2s;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body class="drk">
    <div class="acts tl" id="abox">
        <button class="ibtn" id="mbtn" title="Thoughts">
            ☰
            <span class="tcnt" id="tcnt" aria-label="Saved thoughts"></span>
        </button>
        <button class="ibtn" id="sbtn" title="Settings">⚙</button>
    </div>

    <main>
        <div class="icnt">
            <textarea id="tinput" placeholder="What's on your mind?"></textarea>
            <div class="suggs" id="suggs"></div>
            <button class="subtn" id="subtn" title="Save Thought">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
            </button>
        </div>
    </main>
    <div class="fmenu" id="tmenu">
        <div class="mhead">
            <span class="mtitl">Thoughts</span>
            <button class="ibtn" id="clstm">✕</button>
        </div>
        <div class="swrap">
            <input type="search" id="tsrch" placeholder="Search your thoughts..." autocomplete="off">
        </div>
        <div class="tlst" id="tlst">
        </div>
    </div>
    <div class="fmenu" id="smenu">
        <div class="mhead">
            <span class="mtitl">Settings</span>
            <button class="ibtn" id="clssm">✕</button>
        </div>
        <div class="sctnt">
            <div class="sgrp">
                <label for="tsel">Themes</label>
                <select id="tsel">
                    <option value="lgt">☀ Light</option>
                    <option value="drk" selected>☾ Dark</option>
                    <option value="mlgt">☀ Melon Light</option>
                    <option value="mln">☾ Melon Dark</option>
                    <option value="red">☾ Crimson</option>
                    <option value="prp">☾ Nebula</option>
                    <option value="eyb">☾ Eyeburn</option>
                    <option value="plm">☾ Plum</option>
                    <option value="snd">☾ Sand</option>
                </select>
            </div>
            <div class="sgrp">
                <label for="imode">Aura Farming</label>
                <select id="imode">
                    <option value="kbd">Disabled</option>
                    <option value="spc">Enabled</option>
                    <option value="both">Sigma</option>
                </select>
            </div>
            <div class="sgrp">
                <label for="mpos">Menu & Settings Position</label>
                <select id="mpos">
                    <option value="tl">Top Left</option>
                    <option value="tr">Top Right</option>
                    <option value="bl">Bottom Left</option>
                    <option value="br">Bottom Right</option>
                </select>
            </div>
        </div>
    </div>
    <div class="edovr" id="edovr">
        <div class="edbox">
            <div class="mhead" style="margin-bottom:0;">
                <span class="mtitl">Edit Thought</span>
                <button class="ibtn" id="edcan">✕</button>
            </div>
            <div class="toast" id="toast" role="status" aria-live="polite">Thought saved to Thoughts</div>
            <textarea class="edtxt" id="edtxt"></textarea>
            <div class="edftr">
                <button class="abtn" id="edcbt" title="Cancel">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                </button>
                <button class="abtn save" id="edsbt" title="Save">
                    <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>
    <script>
        let thts = JSON.parse(localStorage.getItem('m_mem') || '[]');
        let stgs = JSON.parse(localStorage.getItem('m_set') || JSON.stringify({
            thm: 'drk',
            inp: 'kbd',
            pos: 'tl'
        }));
        let dict = JSON.parse(localStorage.getItem('m_ac') || '{}');

        let edidx = null;

        const body = document.body;
        const txta = document.getElementById('tinput');
        const subtn = document.getElementById('subtn');
        const tmenu = document.getElementById('tmenu');
        const smenu = document.getElementById('smenu');
        const edovr = document.getElementById('edovr');
        const edtxt = document.getElementById('edtxt');
        const tlst = document.getElementById('tlst');
        const tsrch = document.getElementById('tsrch');
        const tcnt = document.getElementById('tcnt');
        const toast = document.getElementById('toast');
        const tsel = document.getElementById('tsel');
        const imode = document.getElementById('imode');
        const mpos = document.getElementById('mpos');
        const abox = document.getElementById('abox');
        const suggs = document.getElementById('suggs');
        let tmr = null;

        const pairs = {'(':')', '[':']', '{':'}', '"':'"', "'":"'"};

        function addACl(w) {
            w = w.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!w || w.length < 2) return;
            dict[w] = (dict[w] || 0) + 1;
            saveAC();
        }

        function saveAC() {
            let str = JSON.stringify(dict);
            while (str.length > 1000000) {
                let keys = Object.keys(dict).sort((a,b) => dict[a] - dict[b]);
                if (keys.length) delete dict[keys[0]];
                else break;
                str = JSON.stringify(dict);
            }
            localStorage.setItem('m_ac', str);
        }

        function getAC(prefix) {
            prefix = prefix.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!prefix) return [];
            return Object.keys(dict)
                .filter(k => k.startsWith(prefix) && k !== prefix)
                .sort((a,b) => dict[b] - dict[a])
                .slice(0, 3);
        }

        function renAC() {
            suggs.innerHTML = '';
            const val = txta.value;
            const pos = txta.selectionStart;
            const sub = val.slice(0, pos);
            const m = sub.match(/([a-zA-Z0-9]+)$/);
            if (!m) return;
            const pref = m[1];
            const matches = getAC(pref);
            matches.forEach(m => {
                const b = document.createElement('button');
                b.className = 'sbtn';
                b.textContent = m;
                b.type = 'button';
                b.onmousedown = (e) => {
                    e.preventDefault();
                    const nval = val.slice(0, pos - pref.length) + m + ' ' + val.slice(pos);
                    txta.value = nval;
                    txta.selectionStart = txta.selectionEnd = pos - pref.length + m.length + 1;
                    renAC();
                };
                suggs.appendChild(b);
            });
        }

        function handleAutoClose(e) {
            if (pairs[e.key]) {
                e.preventDefault();
                const start = txta.selectionStart;
                const end = txta.selectionEnd;
                const val = txta.value;
                txta.value = val.substring(0, start) + e.key + pairs[e.key] + val.substring(end);
                txta.selectionStart = txta.selectionEnd = start + 1;
                renAC();
            }
        }

        txta.addEventListener('keydown', handleAutoClose);
        txta.addEventListener('input', renAC);
        txta.addEventListener('click', renAC);

        function upCnt() {
            tcnt.textContent = thts.length ? thts.length : '';
            tcnt.setAttribute('aria-label', `${thts.length} saved thought${thts.length === 1 ? '' : 's'}`);
        }

        function shTst() {
            clearTimeout(tmr);
            toast.classList.add('show');
            tmr = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function apStg() {
            body.className = stgs.thm;
            tsel.value = stgs.thm;
            imode.value = stgs.inp;
            mpos.value = stgs.pos;

            abox.className = `acts ${stgs.pos}`;
        }

        function svStg() {
            stgs.thm = tsel.value;
            stgs.inp = imode.value;
            stgs.pos = mpos.value;
            localStorage.setItem('m_set', JSON.stringify(stgs));
            apStg();
        }

        function renTh() {
            tlst.innerHTML = '';
            const q = tsrch.value.trim().toLowerCase();
            const vis = thts
                .map((thought, index) => ({ thought, index }))
                .filter(({ thought }) => !q || `${thought.text} ${thought.date}`.toLowerCase().includes(q));

            if (vis.length === 0) {
                const msg = thts.length === 0 ? 'No thoughts recorded yet...' : 'No thoughts match that search...';
                tlst.innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:3rem; font-size: 1.1rem;">${msg}</div>`;
                return;
            }

            vis.forEach(({ thought, index }) => {
                const w = thought.text.trim().split(/\s+/);
                const tit = w.length > 0 ? (w.slice(0, 3).join(' ') + (w.length > 3 ? '...' : '')) : 'Empty thought...';
                
                const c = document.createElement('div');
                c.className = 'tcard';
                apClr(c, thought.color);
                c.innerHTML = `
                    <div class="trow1">
                        <span class="ttitl">${escH(tit)}</span>
                    </div>
                    <div class="trow2">
                        <span class="tdate">${thought.date}</span>
                        <div class="tacts">
                            <button class="abtn" onclick="opEd(${index})" title="Edit">
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
                            </button>
                            <button class="abtn color" onclick="opClr(${index}, event)" title="Color code">
                                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-4a2 2 0 0 1-2-2V8a5 5 0 0 0-5-5z" fill="currentColor"/><circle cx="7.5" cy="12" r="1" fill="var(--card)"/><circle cx="10" cy="7.5" r="1" fill="var(--card)"/><circle cx="15" cy="7.5" r="1" fill="var(--card)"/></svg>
                            </button>
                            <button class="abtn del" onclick="delTh(${index})" title="Delete">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                tlst.appendChild(c);
            });
        }

        function escH(t) {
            return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        const clrs = {
            none: null,
            red: '#d03040',
            orange: '#f07000',
            yellow: '#ffba00',
            lime: '#a0c000',
            green: '#209080',
            cyan: '#0090c0',
            blue: '#0050b0',
            purple: '#6010b0',
            pink: '#e02090'
        };

        function apClr(card, color) {
            const hex = clrs[color];
            if (!hex) return;
            card.style.background = `color-mix(in srgb, ${hex} 12%, var(--card))`;
            card.style.borderColor = `color-mix(in srgb, ${hex} 32%, var(--border))`;
        }

        window.opClr = function(index, event) {
            const old = document.querySelector('.cmenu');
            if (old) old.remove();

            const menu = document.createElement('div');
            menu.className = 'cmenu';
            const arr = Object.entries(clrs);
            arr.forEach(([name, hex]) => {
                const opt = document.createElement('button');
                opt.className = `copt${name === 'none' ? ' none' : ''}`;
                opt.type = 'button';
                opt.title = name === 'none' ? 'No color' : name;
                if (hex) opt.style.background = `color-mix(in srgb, ${hex} 70%, var(--card))`;
                opt.onclick = () => {
                    thts[index].color = name;
                    localStorage.setItem('m_mem', JSON.stringify(thts));
                    menu.remove();
                    renTh();
                };
                menu.appendChild(opt);
            });

            const rect = event.currentTarget.getBoundingClientRect();
            menu.style.left = `${Math.min(rect.left, innerWidth - 170)}px`;
            menu.style.top = `${Math.min(rect.bottom + 8, innerHeight - 120)}px`;
            document.body.appendChild(menu);
            setTimeout(() => {
                const close = (e) => {
                    if (!menu.contains(e.target) && e.target !== event.currentTarget) {
                        menu.remove();
                        window.removeEventListener('click', close);
                    }
                };
                window.addEventListener('click', close);
            }, 0);
        };

        function addTh() {
            const txt = txta.value.trim();
            if (!txt) return;

            txt.split(/\s+/).forEach(addACl);

            const now = new Date();
            const dstr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            thts.unshift({ text: txt, date: dstr, color: 'none' });
            localStorage.setItem('m_mem', JSON.stringify(thts));
            upCnt();
            shTst();

            txta.value = '';
            txta.classList.add('glow');
            subtn.style.transform = 'scale(0.9)';
            renAC();
            
            setTimeout(() => {
                txta.classList.remove('glow');
                subtn.style.transform = 'scale(1)';
            }, 300);

            renTh();
        }

        window.delTh = function(index) {
            thts.splice(index, 1);
            localStorage.setItem('m_mem', JSON.stringify(thts));
            upCnt();
            renTh();
        }

        window.opEd = function(index) {
            edidx = index;
            edtxt.value = thts[index].text;
            edovr.classList.add('open');
        }

        function clEd() {
            edovr.classList.remove('open');
            edidx = null;
        }

        function svEd() {
            if (edidx !== null) {
                const txt = edtxt.value.trim();
                txt.split(/\s+/).forEach(addACl);
                thts[edidx].text = txt;
                localStorage.setItem('m_mem', JSON.stringify(thts));
                renTh();
                clEd();
            }
        }

        document.getElementById('mbtn').onclick = () => { tmenu.classList.add('open'); renTh(); };
        document.getElementById('sbtn').onclick = () => smenu.classList.add('open');
        subtn.onclick = addTh; 
        document.getElementById('clstm').onclick = () => tmenu.classList.remove('open');
        document.getElementById('clssm').onclick = () => smenu.classList.remove('open');
        document.getElementById('edcan').onclick = clEd;
        document.getElementById('edcbt').onclick = clEd;
        document.getElementById('edsbt').onclick = svEd;
        tsel.onchange = svStg;
        imode.onchange = svStg;
        mpos.onchange = svStg;
        tsrch.oninput = renTh;
        upCnt();
        apStg();
    </script>
</body>
</html>
