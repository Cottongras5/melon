<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melange</title>
<style>
:root{--bg:#111318;--c1:rgba(28,31,40,.92);--tx:#f4f5f7;--muted:#a5aab7;--ac:#62c7b2;--bd:rgba(255,255,255,.13);--sd:rgba(28,31,40,.92);--surface-strong:#202430}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%}
body{background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 42rem),var(--bg);color:var(--tx);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;overflow:hidden;transition:background .3s,color .3s}
body::before{position:fixed;inset:0;z-index:0;pointer-events:none;content:"";opacity:.2;background-image:linear-gradient(color-mix(in srgb,var(--tx) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--tx) 8%,transparent) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
#sd{position:fixed;top:50%;left:16px;transform:translateY(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;background:var(--sd);padding:10px;border-radius:20px;border:1px solid var(--bd);box-shadow:0 18px 48px rgba(0,0,0,.24);backdrop-filter:blur(18px)}
button{background:transparent;border:1px solid transparent;color:var(--ac);width:48px;height:48px;border-radius:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s,background .2s,color .2s}
button:hover{background:var(--ac);border-color:var(--ac);color:var(--bg);transform:translateY(-2px)}
button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sep{height:1px;background:var(--bd);margin:2px 4px}
#fl{display:none}
#svg{position:absolute;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
#svg path{pointer-events:visibleStroke;cursor:pointer;transition:stroke-width .15s,stroke .15s}
#svg path:hover{stroke-width:8;stroke:#ff4444}
#bd{width:100vw;height:100vh;position:relative;overflow:auto;z-index:1}
.cd{position:absolute;width:290px;background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);z-index:2;cursor:grab;transition:box-shadow .2s,border-color .2s}
.cd{min-height:80px}
.cd:hover{border-color:var(--ac);box-shadow:0 18px 42px rgba(0,0,0,.25)}
.cd:active{cursor:grabbing}
.cd.col{width:340px;min-height:200px}
.cd.tbl{width:430px}
.cd.doc,.cd.clr{width:150px}
.cd.lnk{border-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 65%,transparent)}
.bts{position:absolute;top:6px;right:6px;display:flex;gap:8px;z-index:10}
mark{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx);width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
mark svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;pointer-events:none}
mark:hover{background:var(--ac);color:#fff}
.cd content{display:block;outline:none;min-height:40px;color:inherit;user-select:text;margin-top:32px;font-size:16px;line-height:1.5;cursor:text}
.cd content code{background:color-mix(in srgb,var(--ac) 15%,transparent);padding:2px 4px;border-radius:4px;font-family:monospace;font-size:14px}
.cd content h1,.cd content h2,.cd content h3{margin:6px 0;font-weight:700}
.cd content h1{font-size:20px}.cd content h2{font-size:18px}.cd content h3{font-size:16px}
.cd img{max-width:100%;border-radius:8px;display:block;pointer-events:none}
.dpv{display:flex;flex-direction:column;align-items:flex-start;padding:12px 6px 6px;cursor:pointer}
.dic{width:64px;height:80px;background:rgba(0,0,0,.04);border:1px solid var(--bd);border-radius:8px 16px 8px 8px;display:flex;flex-direction:column;padding:10px;justify-content:space-between;margin-bottom:12px;position:relative}
.dic::after{content:'';position:absolute;top:0;right:0;width:16px;height:16px;background:var(--bd);border-bottom-left-radius:8px}
.dln{display:flex;flex-direction:column;gap:4px}
.dln span{height:4px;background:var(--ac);border-radius:2px}
.dln span:nth-child(1){width:80%}.dln span:nth-child(2){width:50%}.dln span:nth-child(3){width:90%}
.dtl{font-size:15px;font-weight:700;margin-bottom:4px;outline:none;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmt{font-size:12px;opacity:.6}
#dmd{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.52);z-index:3000;backdrop-filter:blur(8px);justify-content:center;align-items:center}
.ddg{background:var(--c1);border:1px solid var(--bd);width:min(650px,calc(100vw - 2rem));height:min(80vh,720px);border-radius:22px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.38);overflow:hidden}
.dhd{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.dhd input{font-size:20px;font-weight:700;background:transparent;border:none;color:var(--tx);outline:none;width:60%}
.dac{display:flex;gap:8px;align-items:center}
.dby{flex:1;padding:20px;font-family:monospace;font-size:15px;line-height:1.6;background:rgba(0,0,0,.02);color:var(--tx);border:none;outline:none;resize:none;width:100%}
.tdo{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:16px}
.tdo input[type="checkbox"]{accent-color:var(--ac);cursor:pointer;width:20px;height:20px}
.tdo span{outline:none;color:inherit;flex:1;user-select:text;cursor:text}
.tdo span.dn{text-decoration:line-through;opacity:.4}
.tdo del{cursor:pointer;font-size:16px;color:#888;font-weight:700;padding:4px 6px;border-radius:8px}
.tdo del:hover{color:#ff4444;background:rgba(255,68,68,.1)}
.swc{width:100%;height:60px;border-radius:12px;margin-bottom:8px;transition:background .2s}
.hex{width:100%;background:rgba(0,0,0,.03);border:none;color:inherit;padding:6px 8px;border-radius:10px;font-family:monospace;font-size:14px;outline:none;text-align:center}
.hd{margin-top:20px;margin-bottom:12px}
.ttl{outline:none;font-size:20px;font-weight:700;user-select:text;cursor:text}
.lst{display:flex;flex-direction:column;gap:10px;margin-top:10px;min-height:80px;padding:8px;border-radius:12px;background:rgba(0,0,0,.04)}
.lst .cd{position:relative!important;left:auto!important;top:auto!important;width:100%!important;box-shadow:none}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:30px;margin-bottom:10px}
.tbl-title{font-weight:700;font-size:16px;user-select:text;cursor:text}
.tbl-grid{display:grid;gap:2px;padding:2px;border:1px solid var(--bd);border-radius:10px;background:var(--bd);overflow:auto}
.tbl-cell{position:relative;min-width:72px;min-height:42px;padding:9px 27px 8px 9px;color:var(--tx);background:var(--c1);outline:none;line-height:1.35;cursor:default}
.tbl-cell-text{display:block;min-height:24px;outline:none;user-select:text;cursor:text}
.tbl-cell:first-child{border-radius:7px 0 0 0}.tbl-cell:nth-child(3){border-radius:0 7px 0 0}
.tbl-cell-color{position:absolute;top:4px;right:4px;width:19px;height:19px;padding:0;border:0;border-radius:6px;background:color-mix(in srgb,var(--tx) 10%,transparent);font-size:11px;opacity:.55}
.tbl-cell-color:hover{opacity:1}
.tbl-row-resize{cursor:ns-resize}
.rsz{position:absolute;right:1px;bottom:1px;width:12px;height:12px;cursor:nwse-resize;opacity:.35}
.rsz::after{content:"";position:absolute;right:1px;bottom:1px;width:7px;height:7px;border-right:2px solid var(--tx);border-bottom:2px solid var(--tx);border-radius:0 0 3px 0}
.cd.rsz-w{cursor:ew-resize}.cd.rsz-h{cursor:ns-resize}.cd.rsz-wh{cursor:nwse-resize}
.tbl-pop{position:fixed;display:flex;flex-direction:column;gap:9px;width:170px;padding:11px;background:var(--c1);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:2200}
.tbl-pop label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--tx);font-size:12px}
.tbl-pop input{width:64px;padding:5px 7px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);outline:none}
.tbl-pop button{width:100%;height:30px;background:var(--ac);color:var(--bg);font-size:12px;font-weight:700}
#mdl{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--c1);border:1px solid var(--bd);padding:20px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:2000;width:min(330px,calc(100vw - 2rem))}
#mdl h3{height:25px;margin-bottom:14px;font-size:20px;color:var(--tx)}
#mdl select{width:100%;height:60px;padding:15px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:none;font-size:18px;cursor:pointer}
#mdl button{height:48px;margin-top:16px;width:100%;background:var(--ac);color:var(--bg);border-radius:14px;font-size:16px;font-weight:700}
.ppi{animation:pi .12s ease-out forwards}
.ppo{animation:po .12s ease-in forwards}
@keyframes pi{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes po{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.92)}}
.mn{position:absolute;display:flex;flex-wrap:wrap;gap:6px;width:150px;padding:8px;background:var(--c1);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:1000}
.dt{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;transition:transform .1s}
.dt:hover{transform:scale(1.2)}
.acc{color:var(--ac)}
.no-animations *, .no-animations *::before, .no-animations *::after{animation:none!important;transition:none!important}
@media(max-width:700px){#sd{top:auto;right:12px;bottom:12px;left:12px;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center}.sep{width:1px;height:36px;margin:4px 2px}.cd{max-width:calc(100vw - 32px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="sd">
  <button onclick="add('text')" title="Nueva tarjeta">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
  </button>
  <button onclick="add('col')" title="Nueva columna">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
  </button>
  <button onclick="add('doc')" title="Nuevo documento">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
  </button>
  <button onclick="add('tdo')" title="Nueva lista">
    <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  </button>
  <button onclick="add('tbl')" title="Nueva tabla">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>
  </button>
  <button onclick="add('clr')" title="Nueva paleta de color">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/></svg>
  </button>
  <div class="sep"></div>
  <button onclick="inp()" title="Importar JSON">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <button onclick="out()" title="Exportar JSON">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
  <button onclick="pop()" title="Ajustes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button onclick="wipe()" title="Limpiar el tablero">
    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
  <input type="file" id="fl" onchange="read(event)">
</div>

<div id="mdl">
  <h3>Temas</h3>
  <select id="slc" onchange="apply(this.value)"></select>
  <label style="display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--tx);font-size:14px;">
    <input type="checkbox" id="anm" onchange="toggleAnimations(this.checked)">
    <span>Disable Animations</span>
  </label>
  <button onclick="pop()">Cerrar</button>
</div>

<div id="dmd">
  <div class="ddg ppi">
    <div class="dhd">
      <input type="text" id="dti" placeholder="Título">
      <div class="dac">
        <mark onclick="downloadDoc()" title="Descargar .md">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </mark>
        <mark onclick="closeDocModal()" title="Cerrar">✕</mark>
      </div>
    </div>
    <textarea id="dtx" class="dby" placeholder="Escribe tus proyectadas en Markdown aquí."></textarea>
  </div>
</div>

<svg id="svg"></svg>
<div id="bd"></div>

<script>
let elB = document.getElementById('bd');
let elS = document.getElementById('svg');
let elF = document.getElementById('fl');
let elM = document.getElementById('mdl');
let elC = document.getElementById('slc');
let elD = document.getElementById('dmd');
let elI = document.getElementById('dti');
let elT = document.getElementById('dtx');
let elN = document.getElementById('anm');

let aid = null;
let cds = [];
let lks = [];
let drg = null;
let rsz = null;
let src = null;
let ox = 0, oy = 0, sx = 0, sy = 0;
let shf = false;
let thm = 'dark';
let animationsOff = false;

elB.addEventListener('scroll', draw, {passive:true});
window.addEventListener('resize', draw);

const ths = {
  light:{name:"☀ Light",bg:"#e9eee7",c1:"rgba(255,255,255,.9)",tx:"#17231b",ac:"#63bd46",bd:"rgba(23,35,27,.15)",sd:"#ffffff"},
  dark:{name:"☾ Dark",bg:"#111318",c1:"rgba(28,31,40,.92)",tx:"#f4f5f7",ac:"#62c7b2",bd:"rgba(255,255,255,.13)",sd:"rgba(28,31,40,.92)"},
  melonlight:{name:"☀ Melon Light",bg:"#cfe9e5",c1:"rgba(255,251,245,.92)",tx:"#3d2920",ac:"#f28a3d",bd:"rgba(61,41,32,.15)",sd:"#fff"},
  melon:{name:"☾ Melon Dark",bg:"#203b40",c1:"rgba(47,79,84,.94)",tx:"#fff8ef",ac:"#ff974b",bd:"rgba(255,248,239,.2)",sd:"rgba(47,79,84,.94)"},
  redspace:{name:"☾ Crimson",bg:"#17090f",c1:"rgba(52,13,29,.9)",tx:"#fff3f6",ac:"#ff4f7b",bd:"rgba(255,105,145,.32)",sd:"rgba(52,13,29,.9)"},
  purplespace:{name:"☾ Nebula",bg:"#110d1f",c1:"rgba(38,22,65,.9)",tx:"#f8f2ff",ac:"#c783ff",bd:"rgba(194,131,255,.3)",sd:"rgba(38,22,65,.9)"},
  eyeburn:{name:"☾ Eyeburn",bg:"#000",c1:"#080808",tx:"#fff",ac:"#fff",bd:"#555",sd:"#080808"},
  plum:{name:"☾ Plum",bg:"#17121d",c1:"rgba(39,27,49,.9)",tx:"#f4eafa",ac:"#7affc6",bd:"rgba(255,255,255,.14)",sd:"rgba(39,27,49,.9)"},
  sand:{name:"☾ Sand",bg:"#171614",c1:"rgba(45,39,31,.9)",tx:"#f7eee2",ac:"#ffd166",bd:"rgba(255,238,214,.16)",sd:"rgba(45,39,31,.9)"}
};

const clrs = {
  default:"var(--c1)",red:"#d03040",orange:"#f07000",yellow:"#ffba00",
  lime:"#a0c000",green:"#209080",cyan:"#0090c0",blue:"#0050b0",
  purple:"#6010b0",pink:"#e02090",brown:"#7a3a2a",white:"#f0f0f0",
  silver:"#707a80",gray:"#414243",black:"#101010"
};

function setup(){
  elC.innerHTML = '';
  Object.keys(ths).forEach(k => {
    let o = document.createElement('option');
    o.value = k;
    o.innerText = ths[k].name || k;
    if(k === thm) o.selected = true;
    elC.appendChild(o);
  });
}

function apply(n){
  thm = n;
  let c = ths[n] || ths.dark;
  if(!c) return;
  document.documentElement.style.setProperty('--bg', c.bg);
  document.documentElement.style.setProperty('--c1', c.c1);
  document.documentElement.style.setProperty('--tx', c.tx);
  document.documentElement.style.setProperty('--ac', c.ac);
  document.documentElement.style.setProperty('--bd', c.bd);
  document.documentElement.style.setProperty('--sd', c.sd);
  document.documentElement.classList.toggle('no-animations', animationsOff);
  save();
}

function toggleAnimations(off){
  animationsOff = off;
  document.documentElement.classList.toggle('no-animations', animationsOff);
  elN.checked = animationsOff;
  save();
}

function pop(){
  elM.style.display = elM.style.display === 'block' ? 'none' : 'block';
}

function load(){
  let r = localStorage.getItem('melange');
  if(r){
    try{
      let d = JSON.parse(r);
      cds = d.cds || [];
      cds.sort((a,b) => a.ord - b.ord);
      lks = d.lks || [];
      thm = d.thm || 'dark';
      animationsOff = !!d.animationsOff;
      render();
      draw();
    }catch(e){}
  }
  setup();
  apply(thm);
}

function save(){
  localStorage.setItem('melange', JSON.stringify({cds:cds, lks:lks, thm:thm, animationsOff:animationsOff}));
  draw();
}

function wipe(){
  cds = [];
  lks = [];
  elB.innerHTML = '';
  localStorage.removeItem('melange');
  draw();
}

function out(){
  let b = new Blob([JSON.stringify({cds:cds, lks:lks, thm:thm}, null, 2)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'melange.json';
  a.click();
}

function inp(){ elF.click(); }

function read(e){
  let f = e.target.files[0];
  if(!f) return;
  let r = new FileReader();
  r.onload = (res) => {
    try{
      let d = JSON.parse(res.target.result);
      cds = d.cds || d.cards || [];
      cds.sort((a,b) => (a.ord || a.order) - (b.ord || b.order));
      lks = d.lks || d.links || [];
      thm = d.thm || d.theme || 'dark';
      render();
      apply(thm);
      save();
    }catch(err){}
  };
  r.readAsText(f);
}

function add(t, x, y, v){
  let init = v;
  if(!init){
    if(t === 'tdo') init = [{txt:'-', dn:false}];
    else if(t === 'tbl') init = {ttl:'Tabla', rows:3, cols:3, cells:[]};
    else if(t === 'clr') init = '#e65100';
    else if(t === 'col') init = {ttl:'Columna'};
    else if(t === 'doc') init = {ttl:'Nuevo documento', cnt:''};
    else init = 'La nota';
  }

  let item = {
    id: Date.now(),
    t: t || 'text',
    x: x || 120,
    y: y || 120,
    clr: 'default',
    val: init,
    prn: null,
    ord: Date.now()
  };
  cds.push(item);
  render(item.id);
  save();
}

function nest(p, c){
  let cur = cds.find(i => i.id === c);
  while(cur && cur.prn){
    if(cur.prn === p) return true;
    cur = cds.find(i => i.id === cur.prn);
  }
  return false;
}

function parseMarkdown(t){
  if(!t) return '';
  return t.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/^# (.*$)/gm, '<h1>$1</h1>')
          .replace(/^## (.*$)/gm, '<h2>$1</h2>')
          .replace(/^### (.*$)/gm, '<h3>$1</h3>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
}

function getCaret(n){
  let s = window.getSelection();
  if(!s.rangeCount) return 0;
  let r = s.getRangeAt(0);
  let p = r.cloneRange();
  p.selectNodeContents(n);
  p.setEnd(r.endContainer, r.endOffset);
  return p.toString().length;
}

function setCaret(n, p){
  let r = document.createRange();
  let stk = [n];
  let f = false, c = 0;
  while(stk.length > 0){
    let node = stk.pop();
    if(node.nodeType === 3){
      let nxt = c + node.nodeValue.length;
      if(!f && p >= c && p <= nxt){
        r.setStart(node, p - c);
        r.collapse(true);
        f = true;
        break;
      }
      c = nxt;
    }else{
      let i = node.childNodes.length;
      while(i--) stk.push(node.childNodes[i]);
    }
  }
  if(f){
    let s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }
}

    bts.className = 'bts';

    pal.title = 'Cambiar color';
    pal.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/></svg>`;

      ab.onclick = (e) => {

        item.val.push({txt:'Nueva tarea', dn:false});
        save();
        render();
      };

    }

    bts.appendChild(cls);

    let bdy = document.createElement('content');

    if(type === 'img'){
      let img = document.createElement('img');
      img.src = item.val;
      bdy.appendChild(img);

      bdy.contentEditable = false;
      todos(bdy, item);

      swatch(bdy, item);
    }else if(type === 'col' || type === 'column'){
      bdy.contentEditable = false;
      column(bdy, item);
    }else if(type === 'doc'){
      bdy.contentEditable = false;
      documentCard(bdy, item);
    }else if(type === 'tbl' || type === 'table'){
      bdy.contentEditable = false;
      table(bdy, item);
    }else{
      bdy.contentEditable = true;
      let rawVal = typeof item.val === 'string' ? item.val : '';
      bdy.innerHTML = parseMarkdown(rawVal);
      bdy.oninput = () => {
        let pos = getCaret(bdy);
        item.val = bdy.innerText;
        bdy.innerHTML = parseMarkdown(item.val);
        setCaret(bdy, pos);
        syncCardMinimum(elem, item, type);
        save();
      };
      bdy.onfocus = () => { bdy.innerText = item.val || ''; };
      bdy.onblur = () => {
        item.val = bdy.innerText;
        bdy.innerHTML = parseMarkdown(item.val);
        syncCardMinimum(elem, item, type);
        save();
      };
    }

    elem.onmousedown = (e) => {
      if(e.target.closest('.bts') || e.target.closest('input') || e.target.closest('select') || e.target.closest('del') || e.target.closest('button') || e.target.isContentEditable) return;
      syncCardMinimum(elem, item, type);
      let rect = elem.getBoundingClientRect();
      let edge = 10;
      let left = e.clientX <= rect.left + edge;
      let right = e.clientX >= rect.right - edge;
      let top = e.clientY <= rect.top + edge;
      let bottom = e.clientY >= rect.bottom - edge;
      if(left || right || top || bottom){
        e.preventDefault();
        e.stopPropagation();
        rsz = {
          kind:'card',
          item,
          elem,
          startX:e.clientX,
          startY:e.clientY,
          startW:rect.width,
          startH:rect.height,
          startLeft:item.x,
          startTop:item.y,
          minW:item.minW || Math.round(rect.width),
          minH:item.minH || Math.round(rect.height),
          left,
          right,
          top,
          bottom
        };
        return;
      }
      e.stopPropagation();
      drg = item;
      shf = false;
      sx = e.clientX;
      sy = e.clientY;
      let r = elem.getBoundingClientRect();
      ox = e.clientX - r.left;
      oy = e.clientY - r.top;
    };

    elem.appendChild(bts);
    elem.appendChild(bdy);
    let grip = document.createElement('span');
    grip.className = 'rsz';
    grip.title = 'Resize';
    grip.onmousedown = (e) => {
      e.preventDefault();
      e.stopPropagation();
      syncCardMinimum(elem, item, type);
      let rect = elem.getBoundingClientRect();
      rsz = {kind:'card',item,elem,startX:e.clientX,startY:e.clientY,startW:rect.width,startH:rect.height,startLeft:item.x,startTop:item.y,minW:item.minW || Math.round(rect.width),minH:item.minH || Math.round(rect.height),left:false,right:true,top:false,bottom:true};
    };
    elem.appendChild(grip);

    if(item.w) elem.style.width = item.w + 'px';
    if(item.h) elem.style.height = item.h + 'px';

    if(prn){
      let node = document.getElementById('lst' + prn);
      if(node) node.appendChild(elem);
      else elB.appendChild(elem);
    }else{
      elB.appendChild(elem);
    }

}

function table(ctr, item){
  ctr.innerHTML = '';
  let val = item.val && typeof item.val === 'object' ? item.val : {};
  let rows = Math.max(1, Math.min(20, Number(val.rows) || 3));
  let cols = Math.max(1, Math.min(12, Number(val.cols) || 3));
  let cells = Array.isArray(val.cells) ? val.cells : [];
  let rowHeights = Array.isArray(val.rowHeights) ? val.rowHeights : [];
  val.ttl = val.ttl || 'Tabla';
  val.rows = rows;
  val.cols = cols;
  val.rowHeights = rowHeights;
  for(let i = 0; i < rows; i++) val.rowHeights[i] = Math.max(42, Number(val.rowHeights[i]) || 42);
  val.rowHeights.length = rows;

  for(let i = 0; i < rows * cols; i++){
    if(!cells[i] || typeof cells[i] !== 'object') cells[i] = {text:'', color:'default'};
    cells[i].text = cells[i].text !== undefined ? cells[i].text : (cells[i].value || '');
    cells[i].color = cells[i].color || 'default';
  }
  cells.length = rows * cols;
  val.cells = cells;

  let head = document.createElement('div');
  head.className = 'tbl-head';
  let title = document.createElement('span');
  title.className = 'tbl-title';
  title.contentEditable = true;
  title.innerText = val.ttl;
  title.oninput = () => {
    val.ttl = title.innerText;
    syncCardMinimum(ctr.closest('.cd'), item, item.t || item.type);
    save();
  };

  head.appendChild(title);

  let grid = document.createElement('div');
  grid.className = 'tbl-grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(72px, 1fr))`;
  grid.style.gridTemplateRows = val.rowHeights.map(h => `${h}px`).join(' ');

  cells.forEach((cell, index) => {
    let tile = document.createElement('div');
    tile.className = 'tbl-cell';
    tile.style.minHeight = '0';
    let color = clrs[cell.color] || clrs.default;
    tile.style.background = color;
    if(['white','yellow','lime'].includes(cell.color)) tile.style.color = '#000';
    else if(cell.color !== 'default') tile.style.color = '#fff';
    let text = document.createElement('span');
    text.className = 'tbl-cell-text';
    text.contentEditable = true;
    text.innerText = cell.text;
    text.oninput = () => {
      cell.text = text.innerText;
      fitTableRows(item, grid);
      syncCardMinimum(ctr.closest('.cd'), item, item.t || item.type);
      save();
    };
    let colorButton = document.createElement('button');
    colorButton.className = 'tbl-cell-color';
    colorButton.type = 'button';
    colorButton.innerText = '●';
    colorButton.title = 'Cambiar color de celda';
    colorButton.onclick = (e) => {
      e.stopPropagation();
      cellMenu(cell, tile, e);
    };
    tile.appendChild(text);
    tile.appendChild(colorButton);
    tile.onmousedown = (e) => {
      let rect = tile.getBoundingClientRect();
      let row = Math.floor(index / cols);
      if(e.clientY >= rect.bottom - 8){
        e.preventDefault();
        e.stopPropagation();
        rsz = {kind:'row', item, row, startY:e.clientY, startHeight:val.rowHeights[row], grid, elem:ctr.closest('.cd')};
        return;
      }
      if(e.target.closest('button') || e.target.isContentEditable) return;
    };
    grid.appendChild(tile);
  });

  ctr.appendChild(head);
  ctr.appendChild(grid);
  fitTableRows(item, grid);
}

function fitTableRows(item, grid){
  let val = item.val;
  if(!val || !Array.isArray(val.rowHeights)) return;
  let cols = Math.max(1, Number(val.cols) || 1);
  let next = val.rowHeights.map(h => Math.max(42, Number(h) || 42));
  [...grid.children].forEach((tile, index) => {
    let text = tile.querySelector('.tbl-cell-text');
    if(!text) return;
    let row = Math.floor(index / cols);
    next[row] = Math.max(next[row], text.scrollHeight + 17);
  });
  val.rowHeights = next;
  grid.style.gridTemplateRows = next.map(h => `${h}px`).join(' ');
}

function connect(id){
  if(!src){
    src = id;
    let el = document.getElementById('c' + id);
    if(el) el.classList.add('lnk');
  }else{
    if(src !== id){
      let ex = lks.find(l => (l.a === src && l.b === id) || (l.a === id && l.b === src));
      if(!ex){
        lks.push({a: src, b: id});
      }else{
        lks = lks.filter(l => l !== ex);
      }
      save();
    }
    let el = document.getElementById('c' + src);
    if(el) el.classList.remove('lnk');
    src = null;
    draw();
  }
}

function remove(id){
  cds = cds.filter(c => c.id !== id);
  lks = lks.filter(l => l.a !== id && l.b !== id);
  cds.forEach(c => {
    if(c.prn === id) c.prn = null;
  });
  save();
  render();
}

function draw(){
  elS.innerHTML = '';
  lks.forEach(l => {
    let e1 = document.getElementById('c' + l.a);
    let e2 = document.getElementById('c' + l.b);
    if(!e1 || !e2) return;

    let r1 = e1.getBoundingClientRect();
    let r2 = e2.getBoundingClientRect();

    let x1 = r1.left + r1.width / 2;
    let y1 = r1.top + r1.height / 2;
    let x2 = r2.left + r2.width / 2;
    let y2 = r2.top + r2.height / 2;

    let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let dx = Math.abs(x2 - x1) * 0.5;
    let d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

    path.setAttribute('d', d);
    path.setAttribute('stroke', 'var(--ac)');
    path.setAttribute('stroke-width', '3');
    path.setAttribute('fill', 'none');

    path.onclick = () => {
      lks = lks.filter(item => item !== l);
      save();
      draw();
    };

    elS.appendChild(path);
  });
}

function esc(str){
  if(!str) return '';
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
}

function syncCardMinimum(elem, item, type){
  if(!elem) return;
  let baseW = 290;
  let baseH = 80;
  if(type === 'col' || type === 'column'){
    baseW = 340;
    baseH = 200;
  }else if(type === 'tbl' || type === 'table'){
    baseW = 430;
  }else if(type === 'doc' || type === 'clr' || type === 'color'){
    baseW = 150;
  }

  let content = elem.querySelector('content');
  let minW = baseW;
  let minH = baseH;
  if(content){
    minW = Math.max(minW, content.scrollWidth + 26);
    minH = Math.max(minH, content.offsetTop + content.scrollHeight + 13);
  }

  let grid = elem.querySelector('.tbl-grid');
  if(grid){
    minW = Math.max(minW, grid.scrollWidth + 26);
    minH = Math.max(minH, grid.offsetTop + grid.scrollHeight + 13);
  }

  item.minW = Math.ceil(minW);
  item.minH = Math.ceil(minH);
  elem.style.minWidth = item.minW + 'px';
  elem.style.minHeight = item.minH + 'px';

  if(item.w && item.w < item.minW){
    item.w = item.minW;
    elem.style.width = item.w + 'px';
  }
  if(item.h && item.h < item.minH){
    item.h = item.minH;
    elem.style.height = item.h + 'px';
  }
}

window.onmousemove = (e) => {
  if(rsz){
    if(rsz.kind === 'card'){
      let dx = e.clientX - rsz.startX;
      let dy = e.clientY - rsz.startY;
      if(rsz.left){
        rsz.item.w = Math.max(rsz.minW, Math.round(rsz.startW - dx));
        let actualDx = rsz.startW - rsz.item.w;
        rsz.item.x = Math.round(rsz.startLeft + actualDx);
        rsz.elem.style.left = rsz.item.x + 'px';
      }else if(rsz.right){
        rsz.item.w = Math.max(rsz.minW, Math.round(rsz.startW + dx));
      }
      if(rsz.top){
        rsz.item.h = Math.max(rsz.minH, Math.round(rsz.startH - dy));
        let actualDy = rsz.startH - rsz.item.h;
        rsz.item.y = Math.round(rsz.startTop + actualDy);
        rsz.elem.style.top = rsz.item.y + 'px';
      }else if(rsz.bottom){
        rsz.item.h = Math.max(rsz.minH, Math.round(rsz.startH + dy));
      }
      rsz.item.minW = rsz.minW;
      rsz.item.minH = rsz.minH;
      if(rsz.right) rsz.elem.style.width = rsz.item.w + 'px';
      if(rsz.left) rsz.elem.style.width = rsz.item.w + 'px';
      if(rsz.bottom) rsz.elem.style.height = rsz.item.h + 'px';
      if(rsz.top) rsz.elem.style.height = rsz.item.h + 'px';
      draw();
    }else if(rsz.kind === 'row'){
      let h = Math.max(42, Math.round(rsz.startHeight + e.clientY - rsz.startY));
      rsz.item.val.rowHeights[rsz.row] = h;
      rsz.grid.style.gridTemplateRows = rsz.item.val.rowHeights.map(v => `${v}px`).join(' ');
      syncCardMinimum(rsz.elem, rsz.item, rsz.item.t || rsz.item.type);
    }
    return;
  }
  if(!drg) return;
  let dx = e.clientX - sx;
  let dy = e.clientY - sy;

  if(Math.sqrt(dx * dx + dy * dy) > 5) shf = true;

  if(shf){
    drg.prn = null;
    drg.x = e.clientX - ox;
    drg.y = e.clientY - oy;

    let elem = document.getElementById('c' + drg.id);
    if(elem){
      elem.style.left = drg.x + 'px';
      elem.style.top = drg.y + 'px';
      if(elem.parentElement !== elB) elB.appendChild(elem);
    }
    draw();
  }
};

window.onmouseup = (e) => {
  if(rsz){
    save();
    rsz = null;
    return;
  }
  if(!drg) return;

  if(shf && (drg.t !== 'col' && drg.type !== 'column')){
    let cols = cds.filter(c => (c.t === 'col' || c.type === 'column') && c.id !== drg.id);
    let hit = null;

    cols.forEach(c => {
      let el = document.getElementById('c' + c.id);
      if(!el) return;
      let r = el.getBoundingClientRect();
      if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
        if(!nest(drg.id, c.id)) hit = c.id;
      }
    });

    if(hit){
      drg.prn = hit;
      render();
    }
  }

  drg = null;
  shf = false;
  save();
};

window.onresize = () => draw();
window.onload = () => load();
</script>
