<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟️</text></svg>">
  <style>
    :root {
      --bg: #203b40; --src: #2f4e53; --str: #37636a; --txt: #fff8ef; --mut: #d3e1df;
      --line: #50605f; --acc: #ff974b; --shd: 10px 24px 64px #07161959;
    }
    [data-t="light"] { --bg: #e9eee7; --src: #f5f8f3; --str: #fff; --txt: #17231b; --mut: #607064; --line: #c7d0c8; --acc: #63bd46; --shd: 10px 24px 64px #28582a38; }
    [data-t="dark"] { --bg: #111318; --src: #1c1f28; --str: #202430; --txt: #f4f5f7; --mut: #a5aab7; --line: #3f424b; --acc: #62c7b2; --shd: 10px 24px 64px #00000066; }
    [data-t="mlt"] { --bg: #cfe9e5; --src: #fff8ee; --str: #fff; --txt: #3d2920; --mut: #866b5d; --line: #cdbeb5; --acc: #f28a3d; --shd: 10px 24px 64px #974f203d; }
    [data-t="mdk"] { --bg: #203b40; --src: #2f4e53; --str: #37636a; --txt: #fff8ef; --mut: #d3e1df; --line: #50605f; --acc: #ff974b; --shd: 10px 24px 64px #07161959; }
    [data-t="crim"] { --bg: #17090f; --src: #340d1d; --str: #671b37; --txt: #fff3f6; --mut: #d8a8b8; --line: #7f334d; --acc: #ff4f7b; --shd: 10px 24px 64px #ff174f40; }
    [data-t="nebu"] { --bg: #110d1f; --src: #261641; --str: #51318a; --txt: #f8f2ff; --mut: #c4aedc; --line: #765b99; --acc: #c783ff; --shd: 10px 24px 64px #a94dff40; }
    [data-t="burn"] { --bg: #000; --src: #080808; --str: #111; --txt: #fff; --mut: #bcbcbc; --line: #aaa; --acc: #fff; --shd: 10px 24px 64px #33333359; }

    * { box-sizing: border-box; }
    html { min-height: 100%; font-size: 106%; }
    body {
      position: relative; min-height: 100vh; min-height: 100dvh; margin: 0; overflow-x: hidden; padding: 1rem;
      color: var(--txt); background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      transition: background .45s ease-in-out, color .35s ease-in-out;
    }
    body::before {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; content: "";
      background:
        radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--acc) 22%, transparent) 0, transparent 48%),
        radial-gradient(circle at 82% 88%, #ffffff18 0, #00000042 75%);
    }
    button, select { font: inherit; }
    button, .sq { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .hide { display: none !important; }

    .pbox { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .ptc { position: absolute; background: #ffffff30; box-shadow: 0 0 14px #ffffff22; animation: flt linear infinite; }
    .scir { border-radius: 50%; }
    .ssqr { border-radius: 16%; }
    .stri { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); box-shadow: none; }

    .shll {
      position: relative; z-index: 2; width: min(560px, 100%);
      padding: clamp(1.8rem, 5vw, 3rem) clamp(1.4rem, 5vw, 2.5rem);
      border: 1px solid var(--line); border-radius: 34px;
      background: color-mix(in srgb, var(--src) 88%, transparent);
      box-shadow: var(--shd), inset 0 1px 0 #ffffff2e;
      backdrop-filter: blur(22px); overflow: hidden;
      animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
    }
    .shll::before {
      position: absolute; inset: 0; pointer-events: none; content: ""; opacity: .07;
      background-image: conic-gradient(var(--txt) 90deg, transparent 90deg 180deg, var(--txt) 180deg 270deg, transparent 270deg);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 85% 15%, #000 0%, transparent 68%);
    }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.65rem; }
    .brnd { margin: 0 0 .5rem; font-size: clamp(2.1rem, 7vw, 3.15rem); letter-spacing: -.03em; line-height: 1; }
    .sub { margin: 0; color: var(--mut); font-size: .93rem; line-height: 1.5; max-width: 30ch; }
    .crest {
      position: relative; width: 5.4rem; height: 5.4rem; flex-shrink: 0; border-radius: 26px;
      border: 1px solid var(--line); background: linear-gradient(145deg, var(--str), var(--src));
      box-shadow: var(--shd), inset 0 1px 0 #ffffff40; display: grid; place-items: center;
      transform: rotate(6deg); animation: bob 4.5s ease-in-out infinite;
    }
    .crest span { font-size: 2.55rem; filter: drop-shadow(0 6px 12px #0000004d); }
    .mbtns { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .shll .mbtns .pri { grid-column: 1 / -1; }
    .mbtn {
      width: 100%; padding: .95rem 1.2rem; border: 1px solid var(--line); border-radius: 18px;
      background: var(--str); color: var(--txt); font-weight: 700; font-size: 1rem; cursor: pointer;
      box-shadow: inset 0 1px 0 #ffffff24;
      transition: transform .18s ease-in-out, border-color .18s ease-in-out, background .18s ease-in-out, opacity .18s ease-in-out;
    }
    .mbtn.pri { background: var(--acc); color: #17231b; border-color: var(--acc); font-weight: 800; }
    .mbtn:hover:not(:disabled), .mbtn:focus-visible:not(:disabled) { border-color: var(--acc); transform: translateY(-2px); outline: none; }
    .mbtn:disabled { opacity: .4; cursor: not-allowed; }

    .wrap {
      position: relative; z-index: 2; width: min(560px, calc(100vw - 1.2rem), calc(100dvh - 1.5rem));
      display: flex; flex-direction: column; gap: .55rem; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both;
    }
    .hbar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .tchip {
      display: inline-flex; align-items: center; gap: .55rem; padding: .48rem .85rem;
      border: 1px solid var(--line); border-radius: 15px; background: var(--src); color: var(--txt);
      box-shadow: var(--shd); backdrop-filter: blur(16px); font-weight: 800; font-size: .88rem;
    }
    .tdot { width: .92rem; height: .92rem; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
    .tdot.w { background: #fffdf9; border-color: #1c2226; }
    .tdot.b { background: #1c2226; border-color: #fffdf9; }
    .badge {
      padding: .16rem .48rem; border-radius: 8px; background: var(--acc); color: #17231b;
      font-size: .7rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase;
    }
    .acts { display: flex; align-items: center; gap: .42rem; }
    .ibtn {
      display: grid; width: 2.55rem; height: 2.55rem; place-items: center;
      border: 1px solid var(--line); border-radius: 14px; background: var(--src); color: var(--txt);
      box-shadow: var(--shd); cursor: pointer; font-size: 1.06rem; backdrop-filter: blur(14px);
      transition: transform .18s ease-in-out, border-color .18s ease-in-out, color .18s ease-in-out, opacity .18s ease-in-out;
    }
    .ibtn:hover:not(:disabled), .ibtn:focus-visible:not(:disabled) { color: var(--acc); border-color: var(--acc); transform: translateY(-2px); outline: none; }
    .ibtn:disabled { opacity: .38; cursor: not-allowed; }

    .tray {
      display: flex; align-items: center; justify-content: center; min-height: 2rem;
      padding: .28rem .7rem; border: 1px solid var(--line); border-radius: 14px;
      background: color-mix(in srgb, var(--src) 85%, transparent); backdrop-filter: blur(12px);
    }
    .caps { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; min-height: 1.15rem; }
    .mcp { width: 1.12rem; height: 1.12rem; display: grid; place-items: center; }
    .mcp svg, .pc svg, .ppic svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .bfr {
      position: relative; width: 100%; aspect-ratio: 1; padding: .55rem;
      border: 1px solid var(--line); border-radius: 26px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--str) 85%, #fff), var(--src));
      box-shadow: var(--shd), inset 0 1px 0 #ffffff33;
    }
    .brd {
      position: relative; width: 100%; height: 100%; display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
      border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
      transition: transform .55s cubic-bezier(.22, 1, .36, 1);
    }
    .brd.flip { transform: rotate(180deg); }
    .sq {
      position: relative; display: grid; place-items: center; user-select: none;
      transition: transform .55s cubic-bezier(.22, 1, .36, 1), background .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    .brd.flip .sq { transform: rotate(180deg); }
    .sq.lite { background: color-mix(in srgb, #ffffff 84%, var(--acc) 16%); }
    .sq.dark { background: color-mix(in srgb, var(--str) 66%, var(--acc) 34%); }
    .sq.lst { box-shadow: inset 0 0 0 99px color-mix(in srgb, var(--acc) 28%, transparent); }
    .sq.sel { box-shadow: inset 0 0 0 3px var(--acc), inset 0 0 18px color-mix(in srgb, var(--acc) 45%, transparent); }
    .sq.chk { background: radial-gradient(circle, #ff3b4e 15%, #b81428 90%); animation: puls .85s ease-in-out infinite; }
    .sq.mov { cursor: pointer; }
    .sq.dst { cursor: pointer; }
    .sq.dst::after {
      content: ""; width: 30%; height: 30%; border-radius: 50%;
      background: var(--acc); box-shadow: 0 0 0 3px #17231b38;
      transition: transform .15s ease-in-out; pointer-events: none; z-index: 3;
    }
    .sq.dst:hover::after { transform: scale(1.28); }
    .sq.cap::after {
      width: 78%; height: 78%; background: transparent;
      border: 3.5px solid var(--acc); box-shadow: 0 0 12px color-mix(in srgb, var(--acc) 65%, transparent);
    }
    .crd {
      position: absolute; font-size: .58rem; font-weight: 800; line-height: 1; opacity: .62; pointer-events: none;
    }
    .sq.lite .crd { color: #1c2721; }
    .sq.dark .crd { color: #f6f8f7; }
    .crd.rk { top: 3px; left: 4px; }
    .crd.fl { bottom: 3px; right: 4px; }

    .pc {
      position: relative; z-index: 2; width: 78%; height: 78%; display: grid; place-items: center;
      filter: drop-shadow(0 3px 4px #00000059); transition: transform .16s ease-in-out; pointer-events: none;
    }
    .sq.mov:hover .pc { transform: translateY(-2px) scale(1.05); }
    .sq.sel .pc { transform: translateY(-3px) scale(1.09); }
    .pc.anim { z-index: 12; }

    .mod { position: fixed; inset: 0; z-index: 50; background: #00000099; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .2s ease-in-out; }
    .mbox { width: min(400px, 100%); max-height: 90dvh; overflow-y: auto; padding: 1.45rem; border: 1px solid var(--line); border-radius: 26px; background: var(--str); box-shadow: var(--shd); animation: pop .24s cubic-bezier(.2, .8, .2, 1); }
    .mhd { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
    .mhd h2 { margin: 0; font-size: 1.15rem; }
    .set { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .72rem 0; border-top: 1px solid var(--line); }
    .set label, .set span { font-size: .88rem; }
    select { max-width: 11.5rem; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: .42rem .55rem; background: var(--src); cursor: pointer; }
    .seg { display: flex; gap: .35rem; flex-shrink: 0; }
    .sbtn { min-width: 2.3rem; padding: .38rem .58rem; border: 1px solid var(--line); border-radius: 10px; background: var(--src); color: var(--txt); font-weight: 700; font-size: .8rem; cursor: pointer; transition: border-color .15s ease-in-out, background .15s ease-in-out, color .15s ease-in-out; }
    .sbtn.act { background: var(--acc); color: #17231b; border-color: var(--acc); }

    .swch { position: relative; width: 2.8rem; height: 1.55rem; flex-shrink: 0; }
    .swch input { width: 0; height: 0; opacity: 0; }
    .slid { position: absolute; inset: 0; border-radius: 2rem; background: var(--mut); cursor: pointer; transition: .22s ease-in-out; }
    .slid::before { position: absolute; width: 1.15rem; height: 1.15rem; left: .2rem; bottom: .2rem; content: ""; border-radius: 50%; background: var(--bg); transition: .22s ease-in-out; }
    .swch input:checked + .slid { background: var(--acc); }
    .swch input:checked + .slid::before { transform: translateX(1.25rem); }

    .prow { display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem; padding-top: .4rem; }
    .ppic {
      aspect-ratio: 1; padding: .55rem; border: 1px solid var(--line); border-radius: 16px;
      background: var(--src); cursor: pointer; display: grid; place-items: center;
      transition: transform .15s ease-in-out, border-color .15s ease-in-out;
    }
    .ppic:hover, .ppic:focus-visible { border-color: var(--acc); transform: translateY(-2px); outline: none; }

    .cfti { position: fixed; top: -20px; width: 11px; height: 11px; border-radius: 3px; z-index: 70; pointer-events: none; animation: cfall linear forwards; }
    .sprk { position: fixed; width: 8px; height: 8px; border-radius: 50%; z-index: 65; pointer-events: none; }
    .wico { width: 4rem; height: 4rem; margin: 0 auto .8rem; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; border: 2px solid var(--line); background: var(--src); box-shadow: var(--shd); }

    .aur, .aur * { color: #ff1e1e !important; }
    .aur .tdot.w { border-color: #ff1e1e; }

    .noa *, .noa *::before, .noa *::after { animation: none !important; scroll-behavior: auto !important; transition: none !important; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes bob { 0%, 100% { transform: rotate(6deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-5px); } }
    @keyframes puls { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes flt { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; } }
    @keyframes cfall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(108vh) rotate(720deg); opacity: 0; } }

    @media (max-width: 540px) {
      body { padding: max(.45rem, env(safe-area-inset-top)) .4rem max(.45rem, env(safe-area-inset-bottom)); }
      .shll { border-radius: 26px; padding: 1.5rem 1.2rem; }
      .crest { width: 4.3rem; height: 4.3rem; border-radius: 20px; }
      .crest span { font-size: 2.05rem; }
      .shll .mbtns { grid-template-columns: 1fr; }
      .bfr { padding: .35rem; border-radius: 20px; }
      .brd { border-radius: 14px; }
      .tchip { padding: .42rem .68rem; font-size: .82rem; }
      .ibtn { width: 2.4rem; height: 2.4rem; border-radius: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-t="mdk">
  <div class="pbox" id="pbx" aria-hidden="true"></div>

  <main class="shll" id="menu">
    <div class="hero">
      <div>
        <h1 class="brnd" data-i="ttl">Chess</h1>
        <p class="sub" data-i="sub">Crisp strategy crafted to glide on any worthy machine.</p>
      </div>
      <div class="crest" aria-hidden="true"><span>♞</span></div>
    </div>
    <div class="mbtns">
      <button class="mbtn pri" id="bnew" type="button" data-i="new">New Game</button>
      <button class="mbtn" id="bcnt" type="button" data-i="cnt" disabled>Continue</button>
      <button class="mbtn" id="bset" type="button" data-i="set">Settings</button>
    </div>
  </main>

  <section class="wrap hide" id="game" aria-label="Chess arena">
    <header class="hbar">
      <div class="tchip">
        <span class="tdot w" id="tdot"></span>
        <span id="tmsg">White's Turn</span>
        <span class="badge hide" id="baur">Aura</span>
      </div>
      <div class="acts">
        <button class="ibtn" id="bhom" type="button" aria-label="Menu">⌂</button>
        <button class="ibtn" id="budo" type="button" aria-label="Undo" disabled>↶</button>
        <button class="ibtn" id="bgs" type="button" aria-label="Settings">⚙</button>
      </div>
    </header>
    <div class="tray" id="topb"></div>
    <div class="bfr"><div class="brd" id="brd"></div></div>
    <div class="tray" id="botb"></div>
  </section>

  <div class="mod hide" id="setm" role="dialog" aria-modal="true">
    <div class="mbox">
      <div class="mhd"><h2 data-i="set">Settings</h2><button class="ibtn" id="clss" type="button">✕</button></div>
      <div class="set">
        <label for="sthm" data-i="thm">Theme</label>
        <select id="sthm">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="mlt">Melon Light</option>
          <option value="mdk">Melon Dark</option>
          <option value="crim">Crimson</option>
          <option value="nebu">Nebula</option>
          <option value="burn">Eyeburn</option>
        </select>
      </div>
      <div class="set">
        <label for="slng" data-i="lng">Language</label>
        <select id="slng">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="pt-BR">Português</option>
        </select>
      </div>
      <div class="set">
        <span data-i="frs">Who Goes First</span>
        <div class="seg" id="wfrs">
          <button class="sbtn act" data-v="w" type="button" data-i="wht">White</button>
          <button class="sbtn" data-v="b" type="button" data-i="blk">Black</button>
          <button class="sbtn" data-v="r" type="button" data-i="rnd">Random</button>
        </div>
      </div>
      <div class="set">
        <span data-i="flp">Flip Board on Turn Swap</span>
        <label class="swch"><input id="sfrp" type="checkbox"><span class="slid"></span></label>
      </div>
      <div class="set">
        <span data-i="aur">Aura Guardians</span>
        <label class="swch"><input id="saur" type="checkbox"><span class="slid"></span></label>
      </div>
      <div class="set">
        <span data-i="noa">Disable Animations</span>
        <label class="swch"><input id="snoa" type="checkbox"><span class="slid"></span></label>
      </div>
      <div class="set">
        <span data-i="npt">Disable Background Particles</span>
        <label class="swch"><input id="sptc" type="checkbox"><span class="slid"></span></label>
      </div>
    </div>
  </div>

  <div class="mod hide" id="prom" role="dialog" aria-modal="true">
    <div class="mbox" style="text-align:center">
      <div class="mhd"><h2 data-i="prm">Promote Pawn</h2></div>
      <div class="prow" id="pbox"></div>
    </div>
  </div>

  <div class="mod hide" id="winm" role="dialog" aria-modal="true">
    <div class="mbox" style="text-align:center">
      <div class="wico" id="wico">🏆</div>
      <h2 id="wtxt" style="margin:0 0 .45rem;font-size:1.5rem">White Wins!</h2>
      <p id="wsub" style="margin:0 0 1.35rem;color:var(--mut);font-size:.92rem">Checkmate on the board.</p>
      <div class="mbtns">
        <button class="mbtn pri" id="agn" type="button" data-i="agn">Play Again</button>
        <button class="mbtn" id="wmnu" type="button" data-i="mnu">Menu</button>
      </div>
    </div>
  </div>

  <script>
    const kThm = "melon-theme", kLng = "melon-language", kAur = "melon-aura", kNoa = "melon-disable-animations", kCst = "themeditor-themes", kSav = "melon_chess_save", kCfg = "melon_chess_cfg";
    const b = document.body, $ = (id) => document.getElementById(id);
    let cst = JSON.parse(localStorage.getItem(kCst) || "{}"), cfg = Object.assign({ f: "w", flp: false, npt: false }, JSON.parse(localStorage.getItem(kCfg) || "{}"));
    let st = null, sel = null, mvs = [], pnd = null, actx = null, wKey = "wwin", sKey = "chkM";

      }
      const p = st.bd[r][c];
      if (p?.c === st.tn) {
        if (sel && sel[0] === r && sel[1] === c) { sel = null; mvs = []; }
        else { sel = [r, c]; mvs = lglMs(st.bd, r, c, st.ep, isAur()); sfx(580, 0.05); }
        draw();
      } else if (sel) {
        sel = null; mvs = []; draw();
      }
    }

    function doMv(mv, pTyp) {
      const fEl = document.querySelector(`.pc[data-pc="${mv.fr}-${mv.fc}"]`);
      const r0 = fEl ? fEl.getBoundingClientRect() : null;
      const cPc = mv.ep ? st.bd[mv.fr][mv.tc] : st.bd[mv.tr][mv.tc];

      st.his.push(JSON.stringify({ bd: st.bd, tn: st.tn, ep: st.ep, lst: st.lst, cap: st.cap }));
      if (st.his.length > 60) st.his.shift();

      if (cPc) st.cap[st.tn].push(cPc.t);
      st.bd = simMv(st.bd, mv, pTyp);
      st.ep = mv.dp ? [(mv.fr + mv.tr) / 2, mv.fc] : null;
      st.lst = [mv.fr, mv.fc, mv.tr, mv.tc];
      st.tn = st.tn === "w" ? "b" : "w";
      sel = null; mvs = []; pnd = null;

      sfx(cPc ? 300 : 520, cPc ? 0.12 : 0.07, cPc ? "triangle" : "sine");
      draw({ to: `${mv.tr}-${mv.tc}`, r0, cap: Boolean(cPc) });

      const t = tr[lng()], aur = isAur(), chk = inChk(st.bd, st.tn, aur), any = hasMv(st.bd, st.tn, st.ep, aur);
      if (!any || insf(st.bd, aur)) {
        wKey = !any && chk ? (st.tn === "w" ? "bwin" : "wwin") : "drw";
        sKey = !any && chk ? "chkM" : !any ? "stlM" : "insM";
        st = null; svG(); apBg(false);
        if (wKey !== "drw") {
          mldy(); cfti();
          $("wico").textContent = "🏆";
        } else {
          sfx(420, 0.2, "triangle");
          $("wico").textContent = "🤝";
        }
        $("wtxt").textContent = t[wKey];
        $("wsub").textContent = t[sKey];
        $("winm").classList.remove("hide");
        return;
      }
      svG();
    }

    $("pbox").addEventListener("click", (e) => {
      const btn = e.target.closest(".ppic");
      if (!btn || !pnd) return;
      $("prom").classList.add("hide");
      doMv(pnd, btn.dataset.t);
    });

    $("bnew").addEventListener("click", () => { sfx(660, 0.09); initG(); });
    $("agn").addEventListener("click", () => { $("winm").classList.add("hide"); sfx(660, 0.09); initG(); });
    $("wmnu").addEventListener("click", () => { $("winm").classList.add("hide"); showM(); });
    $("bcnt").addEventListener("click", () => {
      const raw = localStorage.getItem(kSav);
      if (!raw) return;
      st = JSON.parse(raw); sel = null; mvs = []; pnd = null; sfx(640, 0.08); showG();
    });
    $("budo").addEventListener("click", () => {
      if (!st || !st.his.length || pnd) return;
      const prv = JSON.parse(st.his.pop());
      st.bd = prv.bd; st.tn = prv.tn; st.ep = prv.ep; st.lst = prv.lst; st.cap = prv.cap;
      sel = null; mvs = []; sfx(440, 0.07); svG(); draw();
    });

    $("bset").addEventListener("click", () => { sfx(580, 0.07); $("setm").classList.remove("hide"); });
    $("bgs").addEventListener("click", () => { sfx(580, 0.07); $("setm").classList.remove("hide"); });
    $("clss").addEventListener("click", () => $("setm").classList.add("hide"));
    $("bhom").addEventListener("click", () => { if (!pnd) { sfx(460, 0.07); showM(); } });

    $("wfrs").addEventListener("click", (e) => {
      const btn = e.target.closest(".sbtn");
      if (!btn) return;
      cfg.f = btn.dataset.v; sfx(540, 0.06); svCfg();
    });
    $("sfrp").addEventListener("change", (e) => { cfg.flp = e.target.checked; svCfg(); if (st) draw(); });
    $("sptc").addEventListener("change", (e) => { cfg.npt = e.target.checked; svCfg(); ptcs(); });
    $("sthm").addEventListener("change", () => setT($("sthm").value));
    $("slng").addEventListener("change", () => setL($("slng").value));
    $("saur").addEventListener("change", (e) => {
      b.classList.toggle("aur", e.target.checked);
      localStorage.setItem(kAur, String(e.target.checked));
      sel = null; mvs = [];
      if (st) draw();
    });
    $("snoa").addEventListener("change", (e) => {
      b.classList.toggle("noa", e.target.checked);
      localStorage.setItem(kNoa, String(e.target.checked));
      ptcs();
    });

    window.addEventListener("storage", (e) => {
      if (e.key === kCst) {
        cst = JSON.parse(e.newValue || "{}");
        const cur = $("sthm").value;
        opts();
        setT(cur.startsWith("own:") && !cst[cur.slice(4)] ? "mdk" : cur);
      }
    });

    opts(); svCfg();
    const mapT = { "melon-light": "mlt", "melon-dark": "mdk", crimson: "crim", nebula: "nebu", eyeburn: "burn" };
    const rawT = localStorage.getItem(kThm), sThm = mapT[rawT] || rawT, aThm = ["light", "dark", "mlt", "mdk", "crim", "nebu", "burn"];
    const vThm = !sThm ? "mdk" : (!aThm.includes(sThm) && !cst[sThm.slice(4)]) ? "dark" : sThm;
    const rawL = localStorage.getItem(kLng), vLng = rawL === "pt" ? "pt-BR" : (tr[rawL] ? rawL : "en");
    const vAur = localStorage.getItem(kAur) === "true", vNoa = localStorage.getItem(kNoa) === "true";

    setT(vThm); $("slng").value = vLng; setL(vLng);
    $("saur").checked = vAur; b.classList.toggle("aur", vAur);
    $("snoa").checked = vNoa; b.classList.toggle("noa", vNoa);
    $("bcnt").disabled = !localStorage.getItem(kSav);
    ptcs();
  </script>
</body>
</html>
